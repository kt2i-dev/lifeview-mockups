<div class="page">
  <div class="titlebar"><div><h1>Custom widgets</h1><div class="sub">The shared blocks in CustomWidgets, what they take and when to use them. Don’t change them for one screen: fix the block or ask. The button blocks are on the <a href="buttons.html">Button standard</a>.</div></div></div>
  <section class="wd" id="StickyPageHeader"><div class="wd-h"><h2><code>StickyPageHeader</code></h2><p>The header of every detail and edit screen. It stays in view while the user scrolls, so the buttons and any error are always visible. <strong>Updated 11/18:</strong> a banner row for messages.</p></div><div class="wd-b"><div class="demo"><div class="sph"><div class="sph-l"><a class="back" href="#">← Back</a><div><div class="sph-t">Tax Control</div><div class="sph-s">Federal · effective 08/08/2026</div></div></div><div class="sph-r"><button type="button" class="btn primary"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5l4 4L8 20H4v-4L16.5 3.5z"/><path d="M14 6l4 4"/></svg>Edit</button></div><div class="dsb"><svg class="dsb-i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg><div class="dsb-b">Effective Date must be within the current pay period, 08/08/2026 through 08/21/2026. (TS8033 – EFFECTIVE DATE NOT IN CURRENT PAY PERIOD)<div class="dsb-s">11/18/2026 9:42 AM</div></div></div></div></div><div class="spec"><dl><dt>Use it</dt><dd>On every detail and edit screen, as its header.</dd><dt>Inputs</dt><dd><code>Title</code> (mandatory), <code>Subtitle</code>, <code>BackLabel</code>, <code>RemoveTopSpace</code>, <code>ExtendedClass</code>; for the banner row <code>Message</code>, <code>MessageTitle</code>, <code>MessageDateTimeStamp</code>, <code>MessageVariant</code>, <code>MessageExtendedClass</code>.</dd><dt>Buttons</dt><dd>Put the action buttons in <code>ButtonPlaceholder</code>, the only placeholder, since they vary by screen (View: Edit; Edit: Exceptions · Delete | Cancel · Add · Update).</dd><dt>← Back</dt><dd>Built into the block. Handle its <code>BackClicked</code> event with the screen’s existing back client action.</dd><dt>BackLabel</dt><dd>Optional. The back link’s text: blank = “Back”; name the screen it returns to where that helps (“Back to Check History”).</dd><dt>RemoveTopSpace</dt><dd>Optional Boolean, default False. True adds <code>ds-sticky-header--no-top</code>: the header sticks at the very top (offset 0) instead of below the layout’s top bar. Added 11/21.</dd><dt>Banner row</dt><dd>A <code>MessageBanner</code> under the header row, fed by the <code>Message</code> inputs. Hidden while <code>Message</code> is empty. Errors go here, not at the top of the form, so they stay in view while the user scrolls. A failed save: <code>Message</code> = <code>detail</code> + “ (<code>hostCode</code> – <code>hostMessage</code>)” when <code>hostCode</code> isn’t null, <code>MessageDateTimeStamp</code> = when it failed, <code>MessageVariant</code> error (409: warning).</dd><dt>Converted</dt><dd><code>TaxControl_Detail</code> (the reference), <code>AdditionalPay_Detail</code> (confirmed), <code>Deduction_Detail</code> (not confirmed yet). Not yet: <code>DirectDeposit_Detail</code>, <code>Paycheck_Detail</code>; the accumulator and Gross to Net blocks have their own back-link header, so ask before converting them.</dd><dt>More</dt><dd>See the <a href="detail-template.html">Details/Edit Screen Template</a>.</dd></dl></div></div></section>
  <section class="wd" id="MessageBanner"><div class="wd-h"><h2><code>MessageBanner</code></h2><p>One block for errors, warnings and information messages. Replaces the red text and alert boxes each detail block used to have.</p></div><div class="wd-b"><div class="demo"><span class="demo-t">Error (default), with a title</span><div class="dsb"><svg class="dsb-i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg><div class="dsb-b"><div class="dsb-t">Rejected by Matthew Shelton</div>Testing<div class="dsb-s">11/17/2026 5:33 PM</div></div></div><span class="demo-t">Warning</span><div class="dsb warning"><svg class="dsb-i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18.2a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><div class="dsb-b">Someone else changed this record after you opened it, so it has been reloaded with the latest values. Make your change again.<div class="dsb-s">11/18/2026 9:42 AM</div></div></div><span class="demo-t">Info</span><div class="dsb info"><svg class="dsb-i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg><div class="dsb-b">An information message (sample text).</div></div></div><div class="spec"><dl><dt>Inputs</dt><dd><code>Message</code> (mandatory), <code>Title</code>, <code>DateTimeStamp</code> (date and time), <code>Variant</code> (<code>error</code>, <code>warning</code> or <code>info</code>), <code>ExtendedClass</code>.</dd><dt>Events</dt><dd>None.</dd><dt>Shows</dt><dd>Nothing while <code>Message</code> is empty, so it can stay in place permanently. Otherwise a pale tint with dark text, a colored left edge and an icon; the optional title in bold, the message, then the timestamp small and muted.</dd><dt>Classes</dt><dd>All in the theme (see <a href="#theme-css">Theme classes</a>): <code>ds-banner</code>, <code>ds-banner--warning</code> / <code>--info</code> (picked from <code>Variant</code>), <code>ds-banner__icon</code>, <code>__body</code>, <code>__title</code>, <code>__stamp</code>. No colors or sizes on the widgets.</dd><dt>Use it</dt><dd><ul><li>On detail screens, through <code>StickyPageHeader</code>’s banner row (its <code>Message</code> inputs), not as a separate block in the form.</li><li>Elsewhere (e.g. <code>HR1RequestDetail</code>’s status messages) on its own.</li><li>Long unbroken text, like an API error string, wraps.</li></ul></dd><dt>Used in</dt><dd>11 instances: <code>HR1RequestDetail</code>, the 10 payroll detail and accumulator blocks, and the banner row inside <code>StickyPageHeader</code>.</dd></dl></div></div></section>
  <section class="wd" id="ExceptionHandlingToggle"><div class="wd-h"><h2><code>ExceptionHandlingToggle</code></h2><p>Return Exceptions | Override Exceptions (LifeView’s Submit Options) as a block. Replaces the button group built into <code>TaxControl_Detail</code>.</p></div><div class="wd-b"><div class="demo"><span class="exc"><span class="opts"><button type="button" class="on">Return Exceptions</button><button type="button">Override Exceptions</button></span></span></div><div class="spec"><dl><dt>Inputs</dt><dd><code>Value</code> (mandatory): <code>Return</code> or <code>Override</code>.</dd><dt>Event</dt><dd><code>ValueChanged(NewValue)</code>: the option picked.</dd><dt>Inside</dt><dd>Keeps its own selection and re-syncs from <code>Value</code> when the parent changes it. Uses the same <code>button-group</code> / <code>button-group-item</code> classes as before, so it looks unchanged.</dd><dt>Use it</dt><dd><ul><li>In <code>StickyPageHeader</code>’s <code>ButtonPlaceholder</code>, leftmost, on every screen whose endpoint takes <code>overrideExceptions</code>.</li><li>Bind <code>Value</code> to the screen’s <code>SubmitOption</code>; <code>ValueChanged</code> stores the pick (<code>SubmitOptionOnChange</code>). A wrapper container hides it when the form isn’t being edited.</li><li>Return by default; reset it to Return when the form opens and after each save. Override sends <code>?overrideExceptions=true</code>.</li><li>TS0122: the error message says to try again with Override Exceptions; the user switches this to Override and saves again.</li></ul></dd><dt>Used in</dt><dd>1 instance: <code>TaxControl_Detail</code>.</dd></dl></div></div></section>
  <section class="wd" id="CodeTableDropdown"><div class="wd-h"><h2><code>CodeTableDropdown</code></h2><p>The dropdown for every coded field on an edit form. Loads the code table from the gateway (<code>/v1/codes/{table}</code>).</p></div><div class="wd-b"><div class="demo"><span class="demo-t">Closed</span><div><div class="dd-l">Location</div><div class="dd"><span>CITY HALL</span><span class="ctl"><span aria-hidden="true">×</span><span aria-hidden="true">⌄</span></span></div></div><span class="demo-t">Open: search, description with the code under it</span><div><div class="dd-l">Location</div><div class="dd open"><span>CITY HALL</span><span class="ctl"><span aria-hidden="true">×</span><span aria-hidden="true">⌃</span></span></div><div class="dd-menu"><div class="dd-s">⌕ Search…</div><div class="dd-o on">CITY HALL<small>CHL</small></div><div class="dd-o">CITY SAFETY &amp; WORKERS COMP<small>CSO</small></div><div class="dd-o">COLLABORATIVE RESPONSE DIVISION<small>CRD</small></div></div></div></div><div class="spec"><dl><dt>Inputs</dt><dd><ul><li><code>Table</code> (CodeTables identifier) and <code>Code_Input</code> (Text): mandatory</li><li><code>Qualifier</code>: only for a two-key table (e.g. the benefit plan’s affiliation)</li><li><code>IsRequired</code>, <code>IsValid</code>, <code>IsValidating</code>, <code>ValidationMessage</code>: the red border and message</li><li><code>IsEnabled</code>, <code>DropdownLabel</code>, <code>TabIndex</code>, <code>NextTabIndex</code></li></ul></dd><dt>Event</dt><dd><code>CodeSelected(Code)</code>. Wire it on every use: the handler sets the record’s field (e.g. <code>TaxEntitySelected</code> sets <code>EditForm.taxEntityCode</code>). Focus then moves to <code>NextTabIndex</code>.</dd><dt>Shows</dt><dd>Its own label (<code>DropdownLabel</code>, drawn as <code>ds-label</code>) with a red asterisk when required, then a searchable list sorted by description, the code under each one. Edit only: it has no read-only mode.</dd><dt>Use it</dt><dd><ul><li>In the edit branch of the field’s If on <code>IsEditing</code>. In View use a <code>ds-field</code> with a <code>ds-label</code> and, in its <code>ds-value</code>, a <code>CodeDescriptionConcat</code> of the record’s code and description field (“Code - Description”). See the <a href="detail-template.html">Details/Edit Screen Template</a>.</li><li>A field with no code table (Bureau, Division, Region) is a plain text input.</li><li>Don’t change the block for one screen: it’s used in hundreds of places.</li></ul></dd></dl></div></div></section>
  <section class="wd" id="IncentiveCodeDropdown"><div class="wd-h"><h2><code>IncentiveCodeDropdown</code></h2><p>The same dropdown for the City’s 30 incentive (Additional Pay) codes, from <code>/v1/hr/incentive-codes</code>.</p></div><div class="wd-b"><div class="demo"><div><div class="dd-l">Incentive Code</div><div class="dd"><span>AUTO ALLOWANCE</span><span class="ctl"><span aria-hidden="true">×</span><span aria-hidden="true">⌄</span></span></div></div></div><div class="spec"><dl><dt>Inputs</dt><dd><code>Code_Input</code> (mandatory) plus the same optional inputs as CodeTableDropdown, and <code>IsReadOnly</code>: unlike CodeTableDropdown it kept its read-only mode, which shows the description (one lookup). No <code>Table</code>; <code>Qualifier</code> isn’t used.</dd><dt>Event</dt><dd><code>CodeSelected(IncentiveCode)</code> passes the whole <code>HRIncentiveCode_GetResponse</code> (rate, amount source, payment defaults), not just the code, so the form can fill the amount and defaults.</dd><dt>Shows</dt><dd>The label “Incentive Code” (fixed in the block) and the same searchable list.</dd><dt>Use it</dt><dd>Additional Pay detail, the HR1 Request and the New Hire Request: anywhere HR picks an incentive payment. It’s used in only a few places, so its read-only mode stays.</dd></dl></div></div></section>
  <section class="wd" id="CodeTableText"><div class="wd-h"><h2><code>CodeTableText</code></h2><p>The read-only side of CodeTableDropdown, split out of it: looks a code up in its code table and shows “Code - Description”, the same standard as CodeDescriptionConcat. <strong>Only where OutSystems stores just the code: the HR1 and New Hire requests.</strong></p></div><div class="wd-b"><div class="demo"><div><div class="dd-l">Location</div><div class="txt">CHL - CITY HALL</div></div></div><div class="spec"><dl><dt>Which one</dt><dd>Both show “Code - Description” in View. <code>CodeDescriptionConcat</code> when the GET already returns the code AND its description (every gateway API screen): it only joins them. <code>CodeTableText</code> when only the code is stored locally (HR1 and New Hire): it looks the description up live.</dd><dt>Inputs</dt><dd><code>Table</code> and <code>Code</code> (mandatory), <code>Qualifier</code>, <code>Label</code>.</dd><dt>Events</dt><dd>None.</dd><dt>Shows</dt><dd>An optional label, then “Code - Description”, the description from a live lookup. Blank when <code>Code</code> is empty.</dd><dt>Use it</dt><dd><ul><li>HR1 and New Hire store only the codes, so their detail screens look each one up (one call per field, rerun whenever an input changes). HRMS stores codes the same way.</li><li>Not in EmployeeManagement screens: there the GET already returns the description, so show “Code - Description” with <code>CodeDescriptionConcat</code>.</li></ul></dd></dl></div></div></section>
  <section class="wd" id="FromToInput"><div class="wd-h"><h2><code>FromToInput</code></h2><p>One field row on the HR1 Change Request edit form (<code>HR1Request_Edit</code>): the field’s current value (“from”) with a pencil to change it; while editing, the caller’s input for the new value (“to”) shows under it. <strong>HR1 only.</strong></p></div><div class="wd-b"><div class="demo"><span class="demo-t">Not editing</span><div class="fti"><a class="fti-i" href="#" aria-label="Edit Termination Date"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M16.8 2.6a2 2 0 0 1 2.8 0l1.8 1.8a2 2 0 0 1 0 2.8L9 19.6l-5.4 1.2a.6.6 0 0 1-.7-.7L4.1 14.7z"/></svg></a><div><div class="fti-l">Termination Date</div><div class="fti-v"></div></div></div><div class="fti"><a class="fti-i" href="#" aria-label="Edit Furlough"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M16.8 2.6a2 2 0 0 1 2.8 0l1.8 1.8a2 2 0 0 1 0 2.8L9 19.6l-5.4 1.2a.6.6 0 0 1-.7-.7L4.1 14.7z"/></svg></a><div><div class="fti-l">Furlough</div><div class="fti-v">PERM FT MISC</div></div></div><span class="demo-t">Editing: the caller’s input in InputPlaceholder</span><div class="fti"><a class="fti-i" href="#" aria-label="Cancel editing Effective Date"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></a><div><div class="fti-l">Effective Date</div><div class="fti-v">07/01/2016</div></div></div><div class="fti-in"><div class="dd-l">New Effective Date <span class="req" aria-hidden="true">*</span></div><div class="date">11/05/2026</div></div></div><div class="spec"><dl><dt>Inputs</dt><dd><code>Label</code> (Text): the field name. <code>Value</code> (Text): the current value, shown in both modes. <code>IsEditing</code> (Boolean): True shows the caller’s input.</dd><dt>Event</dt><dd><code>EditCanceled</code>, no parameters: raised by the cancel icon.</dd><dt>Placeholder</dt><dd><code>InputPlaceholder</code>, under the row: the caller’s input for the new value (text, date picker, <code>CodeTableDropdown</code>…), shown only while <code>IsEditing</code>.</dd><dt>Shows</dt><dd><ul><li>Not editing: a pencil icon, then the label (<code>ds-label</code>) with the value under it.</li><li>Editing: an <code>x-circle</code> icon in the pencil’s place; label and value stay, the input appears below.</li><li>The row is an OutSystems UI <code>AlignCenter</code> block in a container with a bottom margin.</li></ul></dd><dt>Value format</dt><dd><ul><li>Text that parses as a date: MM/dd/yyyy; a null date: blank.</li><li>Text that parses as a number: a decimal with 3 places (“80” → “80.000”).</li><li>Anything else: as given.</li></ul></dd><dt>Behavior</dt><dd>The pencil sets <code>IsEditing</code> to True; the cancel icon raises <code>EditCanceled</code> and sets it to False. The block saves nothing: the parent keeps the new value, clears it on <code>EditCanceled</code>, and saves the form.</dd><dt>Use it</dt><dd><ul><li>For every changeable field on <code>HR1Request_Edit</code> (54 rows, two columns per section: Status, Compensation, Position, Additional Pay, Work Schedule).</li><li>Bind <code>IsEditing</code> to a per-field local, pass the label and the current value from the HR1 GET, and drop the input into <code>InputPlaceholder</code>. Label the input “New &lt;Label&gt;”, its asterisk from Mandatory.</li><li>Not on gateway detail screens: those use the <a href="detail-template.html">Details/Edit Screen Template</a>, where Edit switches the whole block.</li></ul></dd><dt>Watch out</dt><dd><ul><li><strong>Numeric codes and IDs:</strong> the number rule also catches text like “05” or “10000” (shown “5.000”, “10000.000”), and amounts get 3 places where the rest of the app shows 2. Not yet checked on the screen with real data.</li><li><strong>Coded values:</strong> <code>Value</code> is Text, so it can’t hold a <code>CodeTableText</code>. To show “Code - Description” the parent passes the joined text.</li></ul></dd></dl></div></div></section>
  <section class="wd" id="DateFormat"><div class="wd-h"><h2><code>DateFormat</code></h2><p>Every date shown as text: list columns and detail screens in View.</p></div><div class="wd-b"><div class="demo"><div class="txt">04/21/2023</div><span class="demo-t">Null date</span><div class="txt" style="min-height:20px"></div></div><div class="spec"><dl><dt>Inputs</dt><dd><code>Date</code> (mandatory), <code>ExtendedClass</code>.</dd><dt>Events</dt><dd>None.</dd><dt>Shows</dt><dd>MM/dd/yyyy, never wrapping. Blank for a null date (OutSystems’ null date is 01/01/1900, the gateway’s “no date”).</dd><dt>Use it</dt><dd>For every displayed date, so null dates are blank everywhere: no N/A, no placeholder date.</dd></dl></div></div></section>
  <section class="wd" id="CodeDescriptionConcat"><div class="wd-h"><h2><code>CodeDescriptionConcat</code></h2><p><strong>The standard for every coded value on a detail screen in View: “Code - Description”, as LifeView shows it</strong>, not the description alone. It joins the code and description it is given; it looks nothing up.</p></div><div class="wd-b"><div class="demo"><div><div class="dd-l">Tax Entity</div><div class="txt">10000 - CITY OF LONG BEACH</div></div><div><div class="dd-l">Frequency</div><div class="txt">5 - EVERY PERIOD</div></div></div><div class="spec"><dl><dt>Which one</dt><dd>Both show “Code - Description” in View. <code>CodeDescriptionConcat</code> when the GET already returns the code AND its description (every gateway API screen): it only joins them. <code>CodeTableText</code> when only the code is stored locally (HR1 and New Hire): it looks the description up live.</dd><dt>Inputs</dt><dd><code>Code</code> and <code>Description</code> (Text).</dd><dt>Events</dt><dd>None.</dd><dt>Shows</dt><dd><code>Code - Description</code>. It only joins the two, like DateFormat only formats a date: simple, but it saves time on the many coded fields. The separator always shows, so an empty value reads “Code - ” or “ - Description”.</dd><dt>Use it</dt><dd><ul><li>On every gateway API screen, in View, as the <code>ds-value</code> of every field that has a code and a description: pass the record’s code and the description the GET returns (e.g. <code>Form.taxEntityCode</code>, <code>Form.taxEntityDescription</code>). It looks nothing up.</li><li>Put it inside the <code>ds-value</code> container (it has no styling of its own).</li><li>In Edit the field is a <code>CodeTableDropdown</code>, as before.</li></ul></dd></dl></div></div></section>
  <section class="wd" id="EffectiveDateFilter"><div class="wd-h"><h2><code>EffectiveDateFilter</code></h2><p>The Effective Date filter row above a payroll list, with its Search and Reset buttons.</p></div><div class="wd-b"><div class="demo"><div class="fbar"><label>Effective Date<span class="date">mm/dd/yyyy</span></label><button type="button" class="sbtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</button><button type="button" class="sbtn out"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>Reset</button></div></div><div class="spec"><dl><dt>Inputs</dt><dd>None.</dd><dt>Event</dt><dd><code>DateSelected(Date)</code>, its only way to talk to the host. Search sends the date in the box; Reset clears the box and sends an empty date (= every record).</dd><dt>Inside</dt><dd><ul><li>The <code>ButtonSearch</code> and <code>ButtonReset</code> blocks, in a container aligned to the bottom (21px top margin) so they line up with the date input.</li><li>The date is the block’s own local variable, bound to the input. Both buttons call <code>SearchResetOnClick</code>, which stores the date it gets and raises <code>DateSelected</code>.</li><li>Not live: changing the date does nothing until the user clicks Search.</li></ul></dd><dt>Use it</dt><dd>The handler stores the date, sets the list’s StartIndex back to 0 and refreshes it. The date goes to the list’s <code>asOf</code>.</dd><dt>Used in</dt><dd>EmployeeProfile_Accruals, _AdditionalPay, _DirectDeposit, _PayDeduction, _PayrollStatus, _TaxControl, _W2s, Garnishments, GrossToNet (one each).</dd></dl></div></div></section>
  <section class="wd" id="ButtonSearch"><div class="wd-h"><h2><code>ButtonSearch / ButtonReset</code></h2><p>The two standard filter buttons. Same structure; they differ in label, icon and style.</p></div><div class="wd-b"><div class="demo"><div class="fbar"><button type="button" class="sbtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</button><button type="button" class="sbtn out"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>Reset</button></div></div><div class="spec"><dl><dt>Search</dt><dd>Label “Search”, <code>magnifying-glass</code> icon, primary button.</dd><dt>Reset</dt><dd>Label “Reset”, <code>prohibit</code> icon (as Cancel), standard button.</dd><dt>Inputs</dt><dd><code>IsEnabled</code> (Boolean, mandatory) and <code>ExtendedClass</code> (Text, optional), as the other button blocks.</dd><dt>Event</dt><dd><code>Clicked</code>. No logic of their own: the screen or block that uses them decides what happens.</dd><dt>Used in</dt><dd>Only <code>EffectiveDateFilter</code> so far. Use them for any other filter’s Search and Reset.</dd></dl></div></div></section>
  <section class="wd" id="APIPagination"><div class="wd-h"><h2><code>APIPagination</code></h2><p>Paging, loading, empty and error states for every list read from the gateway. Lists from an OutSystems aggregate use the standard OutSystems pagination.</p></div><div class="wd-b"><div class="demo"><span class="demo-t">Middle page</span><nav class="pager"><button type="button" class="sbtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Previous</button><span class="pg">Page 2</span><button type="button" class="sbtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Next</button></nav><span class="demo-t">Last page</span><nav class="pager"><button type="button" class="sbtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Previous</button><span class="pg">Page 3 of 3</span></nav><span class="demo-t">Loading: the row stays, both disabled</span><nav class="pager"><button type="button" class="sbtn" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Previous</button><span class="pg">Page 2</span><button type="button" class="sbtn" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Next</button></nav><span class="demo-t">Loading (IsSearching)</span><div class="loadbox" role="status"><span class="spin" aria-hidden="true"></span>Loading…</div><span class="demo-t">Empty (IsEmpty)</span><div class="nores"><svg class="nores-i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></svg>No results found matching search criteria.</div><span class="demo-t">Error (IsError)</span><div class="nores" role="alert"><svg class="nores-i warn-i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18.2a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>Couldn’t load this list: the server didn’t respond in time. Try again in a moment.</div></div><div class="spec"><dl><dt>Inputs</dt><dd><code>IsSearching</code>, <code>IsEmpty</code>, <code>StartIndex</code>, <code>PageSize</code>, <code>HasMore</code> (mandatory), and <code>IsError</code> + <code>ErrorMessage</code> for a failed call.</dd><dt>Event</dt><dd><strong>Changed 11/21:</strong> one mandatory event, <code>PaginationTriggered(NewStartIndex)</code>, replaces <code>NextPage</code> / <code>PreviousPage</code>. The block works the new start index out itself: StartIndex − PageSize for Previous, StartIndex + PageSize for Next.</dd><dt>Handle it</dt><dd>Each list has one <code>PaginationOnNavigate</code> client action with a <code>NewStartIndex</code> input: it assigns the list’s StartIndex and refreshes the list’s data. Never change StartIndex without refreshing (W2s_List and GatewayLogs missed the refresh and were fixed).</dd><dt>While loading</dt><dd>The Previous · Next row stays in place with both buttons disabled, so the page doesn’t jump; it still hides for an empty list or an error. <em>Not yet confirmed in the browser.</em></dd><dt>Shows</dt><dd>A spinner while searching; a large search icon (<code>magnifying-glass</code>) over “No results found matching search criteria.” when there are no rows; a large warning icon (<code>warning</code>) over <code>ErrorMessage</code> when <code>IsError</code>, so an empty list and a failed call look different; otherwise Previous (after page 1) · “Page n” (“Page n of n” on the last page) · Next (while HasMore).</dd><dt>Wiring</dt><dd><ul><li>Send StartIndex as <code>skip</code> and PageSize as <code>pageSize</code> on the gateway call. If <code>pageSize</code> isn’t sent the gateway uses the list’s own default (25 or 50), and pages overlap.</li><li><code>HasMore</code> = the response’s <code>hasMore</code>; <code>IsSearching</code> = not yet fetched; <code>IsEmpty</code> = no rows.</li><li><code>IsError</code> = the data action failed (a non-2xx); <code>ErrorMessage</code> = the error body’s <code>detail</code>, the plain sentence for the user.</li><li>StartIndex back to 0 when a filter changes.</li></ul></dd><dt>Migrated</dt><dd>All 18 gateway lists: EmployeeSearch, ApproversTroubleshooting, EmailErrorLogs, GatewayLogs, HR1Request_AddPopup, Accruals_List, AdditionalPay_List, CalPERS_List, Deductions_List, DirectDeposit_List, Garnishments_List, GrossToNet_List, PaycheckHistory_List, PayrollStatus_List, PERSAccumulators_List, TaxControl_List, W2s_List, and PayrollBatches (already on the new pattern).</dd></dl></div></div></section>
  <section class="wd" id="ProfileTabs"><div class="wd-h"><h2><code>ProfileTabs</code></h2><p>A shared, data-driven tab strip for the Employee Profile’s sections. Added 11/21.</p></div><div class="wd-b"><div class="demo"><span class="demo-t">Payroll section, Details active</span><nav class="ptabs" aria-label="Payroll tabs"><a class="on" href="#" aria-current="page">Details</a><a href="#">Paychecks</a><a href="#">Taxes</a><a href="#">Deductions</a><a href="#">Additional Payments</a><a href="#">Accruals</a><a href="#">W2s</a></nav></div><div class="spec"><dl><dt>Use it</dt><dd>The tab strip in the HR, Payroll and Benefits sections of <code>EmployeeProfile</code>. Looks the same as the OutSystems UI Tabs widget on purpose (same neutral 8 text, neutral 5 divider, neutral 10 + 3px primary indicator on the active tab); the one difference is that its indicator fades instead of sliding.</dd><dt>Inputs</dt><dd><code>Tabs</code> (List of <code>ProfileTabItem</code>, in display order), <code>ActiveTabId</code> (Integer: the active tab’s identifier), <code>ExtendedClass</code> (optional, on the strip root).</dd><dt>Event</dt><dd><code>TabSelected(TabId)</code>, the clicked tab’s id. The block holds no state: the host screen decides what to do.</dd><dt>ProfileTabItem</dt><dd>Structure: <code>Id</code> (Integer), <code>Label</code> (Text, 50), <code>Order</code> (Integer, 0-based).</dd><dt>Wiring</dt><dd><ul><li>Feed <code>Tabs</code> from an aggregate on the section’s static entity (<code>ProfileHRTab</code>, <code>ProfilePayrollTab</code>, <code>ProfileBenefitsTab</code>), type-converted to <code>ProfileTabItem</code>.</li><li><code>ActiveTabId</code> = the client variable, identifier-to-integer.</li><li>On <code>TabSelected</code>: integer back to the identifier, assign it to the client variable.</li></ul></dd><dt>Structure</dt><dd>One container, one list, one link per tab showing its label. No placeholders.</dd><dt>Classes</dt><dd>All in the theme (see <a href="#theme-css">Theme classes</a>): <code>ds-tabs</code>, <code>ds-tabs__item</code>, <code>ds-tabs__item--active</code>. Nothing in the block’s own style sheet.</dd></dl></div></div></section>

  <section class="card" id="theme-css"><h2>Theme classes (LongBeachAdmin theme style sheet)</h2>
    <div class="spec" style="padding:14px 20px 18px"><p style="margin:0 0 8px">Added 11/18/2026 (profile tabs and the sticky header class 11/21). Use them by name; colors and sizes come from the theme variables.</p><dl>
      <dt>List header</dt><dd><code>ds-list-header</code> on a list block’s top bar (title left, buttons right, centered, <code>--space-s</code> below); <code>ds-list-header-actions</code> on the buttons’ container (a row, <code>--space-base</code> gap, cancels <code>.btn + .btn</code>’s margin). On 11 payroll list blocks. See the <a href="list-template.html#structure">List Screen Template</a>.</dd>
      <dt>Sticky header</dt><dd><code>ds-sticky-header--no-top</code> (added 11/21): sets <code>StickyPageHeader</code>’s sticky offset to 0 instead of below the layout top bar. Set by its <code>RemoveTopSpace</code> input.</dd>
      <dt>Profile tabs</dt><dd>Added 11/21, between an opening and an end comment in the theme so it’s easy to find. Theme variables only. Set by <code>ProfileTabs</code>.
        <table class="acc std" style="margin:8px 0 6px"><thead><tr><th scope="col">Class</th><th scope="col">On</th><th scope="col">Does</th></tr></thead><tbody>
        <tr><td><code>ds-tabs</code></td><td>The block’s root container</td><td>The strip: a <code>--border-size-s</code> bottom line, <code>--space-base</code> bottom margin, scrolls sideways when the tabs don’t fit.</td></tr>
        <tr><td><code>ds-tabs [data-list]</code></td><td>The tab list inside it</td><td>One row of tabs that doesn’t wrap.</td></tr>
        <tr><td><code>ds-tabs__item</code></td><td>Each tab link</td><td><code>--space-s</code> × <code>--space-base</code> padding, at least 42px high, no wrapping, regular weight, no underline, a transparent <code>--border-size-l</code> bottom border that overlaps the strip’s line.</td></tr>
        <tr><td><code>ds-tabs__item--active</code></td><td>The active tab (the block adds it)</td><td>Neutral 10 text with a faint thickening (a 0.5px text shadow), and a primary-colored bottom border.</td></tr>
        </tbody></table>
        Hover on an inactive tab darkens the text to neutral 10; keyboard focus shows the OutSystems UI focus highlight (only with accessible features on); the text color fades over 180ms and the border over 200ms. Variables (each with a <code>--color-*</code> fallback where one exists): <code>--border-size-s</code>, <code>--border-size-l</code>, <code>--space-s</code>, <code>--space-base</code>, <code>--font-regular</code>, <code>--text-color-neutral-8</code>, <code>--text-color-neutral-10</code>, <code>--border-color-neutral-5</code>, <code>--background-color-primary</code>, <code>--background-color-focus-outer</code>.</dd>
      <dt>Message banner</dt><dd><code>ds-banner</code> (root: icon left, text right; padding, <code>--space-base</code> below, <code>--border-radius-soft</code>, 4px left edge; a 10% tint of the accent over white, text <code>--color-neutral-9</code>; its private <code>--ds-banner-accent</code> defaults to the error color), <code>ds-banner--warning</code> / <code>ds-banner--info</code> (change only the accent), <code>ds-banner__icon</code> (accent color, heading 5 size, doesn’t shrink), <code>ds-banner__body</code> (wraps long text), <code>ds-banner__title</code> (bold), <code>ds-banner__stamp</code> (<code>--font-size-xs</code>, muted). Set by <code>MessageBanner</code>.</dd>
    </dl>
<pre style="margin:12px 0 0;background:#f6f7f9;border:1px solid #e3e8ef;border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.5;overflow-x:auto">/* List block header: title on the left, actions on the right. */
.ds-list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-s); }
.ds-list-header-actions { display: flex; align-items: center; gap: var(--space-base); }
.ds-list-header-actions .btn + .btn { margin-left: 0; }

/* Message banner (MessageBanner block). Variants: error (default), warning, info. */
.ds-banner { --ds-banner-accent: var(--color-error); display: flex; align-items: flex-start; gap: var(--space-s); padding: var(--space-base); margin-bottom: var(--space-base); border-radius: var(--border-radius-soft); border-left: 4px solid var(--ds-banner-accent); background: color-mix(in srgb, var(--ds-banner-accent) 10%, var(--color-neutral-0)); color: var(--color-neutral-9); }
.ds-banner--warning { --ds-banner-accent: var(--color-warning); }
.ds-banner--info { --ds-banner-accent: var(--color-info); }
.ds-banner__icon { flex-shrink: 0; color: var(--ds-banner-accent); font-size: var(--font-size-h5); line-height: 1.2; }
.ds-banner__body { min-width: 0; overflow-wrap: anywhere; }
.ds-banner__title { font-weight: 700; margin-bottom: var(--space-xs); }
.ds-banner__stamp { font-size: var(--font-size-xs); color: var(--color-neutral-8); margin-top: var(--space-xs); }

/* ===== ProfileTabs block: shared tab strip (Employee Profile sections). Mirrors the OutSystems UI Tabs look. Root ds-tabs, items ds-tabs__item, active item ds-tabs__item--active. ===== */
.ds-tabs { border-bottom: var(--border-size-s) solid var(--border-color-neutral-5, var(--color-neutral-5)); margin-bottom: var(--space-base); overflow-x: auto; }
.ds-tabs [data-list] { display: flex; flex-wrap: nowrap; }
.ds-tabs__item { display: inline-flex; align-items: center; white-space: nowrap; padding: var(--space-s) var(--space-base); min-height: 42px; color: var(--text-color-neutral-8, var(--color-neutral-8)); font-weight: var(--font-regular); text-decoration: none; border-bottom: var(--border-size-l) solid transparent; margin-bottom: calc(-1 * var(--border-size-s)); cursor: pointer; transition: color 180ms ease, border-color 200ms linear; }
.ds-tabs__item:hover:not(.ds-tabs__item--active) { color: var(--text-color-neutral-10, var(--color-neutral-10)); text-decoration: none; }
.ds-tabs__item--active, .ds-tabs__item--active:hover { color: var(--text-color-neutral-10, var(--color-neutral-10)); text-shadow: 0 0 0.5px currentColor; border-bottom-color: var(--background-color-primary, var(--color-primary)); text-decoration: none; }
.has-accessible-features .ds-tabs__item:focus-visible { background-color: var(--background-color-focus-outer, var(--color-focus-outer)); color: var(--text-color-neutral-10, var(--color-neutral-10)); outline: none; }
/* ===== END ProfileTabs ===== */</pre>
    </div>

<script>
(function(){
  var HOLE=/\{\{([^}]*)\}\}/g;
  function get(scope,e){e=(e||'').trim();if(e==='true')return true;if(e==='false')return false;
    return e.split('.').reduce(function(a,k){return a==null?undefined:a[k];},scope);}
  function one(s){var m=(s||'').match(/^\s*\{\{([^}]*)\}\}\s*$/);return m?m[1]:null;}
  function interp(s,scope){return s.replace(HOLE,function(m,e){var v=get(scope,e);return v==null||v===false?'':String(v);});}
  function build(nodes,scope,out){
    for(var i=0;i<nodes.length;i++){var n=nodes[i];
      if(n.nodeType===3){out.appendChild(document.createTextNode(interp(n.data,scope)));continue;}
      if(n.nodeType!==1)continue;
      if(n.tagName==='TEMPLATE'&&n.hasAttribute('data-sc-if')){if(get(scope,one(n.getAttribute('value'))))build(n.content.childNodes,scope,out);continue;}
      if(n.tagName==='TEMPLATE'&&n.hasAttribute('data-sc-for')){
        var list=get(scope,one(n.getAttribute('list')))||[],as=n.getAttribute('as');
        list.forEach(function(item){var sc=Object.create(scope);sc[as]=item;build(n.content.childNodes,sc,out);});continue;}
      var el=n.cloneNode(false),post=[];
      Array.prototype.slice.call(el.attributes).forEach(function(a){
        var nm=a.name,v=a.value;
        if(nm.indexOf('hint-placeholder')===0){el.removeAttribute(nm);return;}
        if(v.indexOf('{{')<0)return;
        if(nm.slice(0,2)==='on'){el.removeAttribute(nm);var fn=get(scope,one(v));if(typeof fn==='function')el.addEventListener(nm.slice(2),fn);return;}
        if(nm==='defaultvalue'){el.removeAttribute(nm);var dv=get(scope,one(v));post.push(function(){el.value=dv==null?'':dv;});return;}
        if(nm==='defaultchecked'){el.removeAttribute(nm);el.checked=!!get(scope,one(v));return;}
        el.setAttribute(nm,interp(v,scope));
      });
      build(n.childNodes,scope,el);post.forEach(function(f){f();});out.appendChild(el);
    }
  }
  var tpl=document.getElementById('dc-template'),root=document.getElementById('dc-root'),comp;
  window.DCLogic=function(props){this.props=props||{};this.state={};};
