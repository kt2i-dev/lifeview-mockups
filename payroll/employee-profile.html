.lbl{font-size:12px;color:#5b6575;font-weight:500}
.req{color:#b42318;margin-left:3px}
.val{font-size:14px;min-height:20px;overflow-wrap:anywhere}

.in{height:38px;border:1px solid #b9c1cc;border-radius:6px;padding:0 10px;font:inherit;font-size:14px;color:#1c2431;background:#fff;box-sizing:border-box;width:100%}

.help{font-size:12px;color:#5b6575}
.src{align-self:flex-start;font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#6b4500;background:#fffbe8;border:1px dashed #d9b75e;border-radius:4px;padding:1px 6px}
.radios{display:flex;flex-wrap:wrap;gap:6px 18px;min-height:38px;align-items:center}
.radio{display:flex;gap:6px;align-items:center;font-size:14px}
.banner{padding:12px 16px;border-radius:8px;background:#e7f4ec;border:1px solid #9fd3b4;color:#14532d;font-size:14px;margin-bottom:16px}
.editing{padding:10px 16px;border-radius:8px;background:#eaf1fd;border:1px solid #b6cdf5;color:#173f84;font-size:14px;margin-bottom:16px}
.warn{padding:10px 16px;border-radius:8px;background:#fff6e5;border:1px solid #f1cf8f;color:#6b4500;font-size:14px;margin-bottom:16px}
.notes{background:#f8fafc;border:1px dashed #b9c1cc;border-radius:10px;padding:14px 20px 16px;font-size:13px;color:#3a4350;line-height:1.55;margin-top:28px}

.notes ul{margin:0;padding-left:18px}
.overlay{position:fixed;inset:0;background:rgba(20,26,36,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dialog{background:#fff;border-radius:10px;max-width:460px;width:100%;padding:22px 24px;box-sizing:border-box}
.dialog h2{margin:0 0 8px;font-size:18px}
.dialog p{margin:0 0 18px;font-size:14px;color:#3a4350;line-height:1.5}
.tblwrap{overflow-x:auto;padding:4px 20px 20px}
table.acc{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
table.acc th{background:#0b4a8b;color:#fff;text-align:left;font-weight:600;font-size:12px;padding:10px 12px}
table.acc th.num{text-align:right}
table.acc td{padding:10px 12px;border-bottom:1px solid #e8ecf1}
table.acc td.num{text-align:right;font-variant-numeric:tabular-nums}
table.acc td.na{text-align:right;color:#8a93a1}
table.acc tr.group td{background:#f3f6fa;font-size:12px;font-weight:600;color:#3a4350;letter-spacing:.03em;text-transform:uppercase;padding:8px 12px}
table.acc tr.total td{font-weight:600}

.page{max-width:1440px}
.ptitle{margin:6px 0 16px;font-size:22px;font-weight:700}
.shell{background:#fff;border-radius:10px;padding:24px 26px 32px}
.emp{border:1px solid #dde2e9;border-left:4px solid #0a5bd3;border-radius:8px;padding:12px 20px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.emp .nm{font-size:18px;font-weight:700}
.emp .k{font-size:12px;color:#8a93a1}.emp .v{font-size:13px;font-weight:600;margin-left:4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:16px 0 18px}
.tile{border:1px solid #dde2e9;border-radius:6px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:14px;color:#2b3340;background:#fff}
.tile .ic{color:#0a5bd3;font-size:16px}
.tile.on{background:#e3edfb;border-color:#0a5bd3;color:#0a5bd3}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid #d3d9e1;margin-bottom:22px}
.tabs button{border:0;background:none;font:inherit;font-size:13px;color:#2b3340;padding:10px 13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{border-bottom-color:#1c2431;font-weight:600}
.lhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.lhead h2{margin:0;font-size:16px;font-weight:700}
.sbtn{min-height:32px;padding:0 14px;border-radius:4px;font:inherit;font-size:12px;cursor:pointer;border:1px solid #0a5bd3;background:#0a5bd3;color:#fff;text-decoration:none;display:inline-flex;align-items:center;box-sizing:border-box}
.sbtn.out{background:#fff;color:#0a5bd3}
.filters{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#3a4350}
.filters input{height:32px;width:320px;max-width:100%;border:1px solid #c5ccd6;border-radius:4px;padding:0 10px;font:inherit;font-size:13px;box-sizing:border-box}
table.list{border-collapse:collapse;width:100%;font-size:12px}
table.list th{background:#0b4a8b;color:#fff;text-align:left;font-weight:600;padding:12px 10px}
table.list td{padding:7px 10px;border-bottom:1px solid #e3e8ef;height:30px}
table.list tbody tr:nth-child(even) td{background:#eaf1fb}
.lact{display:flex;gap:12px}
.lact .sbtn{background:#fff;color:#0a5bd3}
.muted{color:#8a93a1}
.ltbl{overflow-x:auto}
.sum{border:1px solid #dde2e9;border-radius:8px;margin-bottom:14px}
.sum .hd{padding:14px 18px;font-size:13px;border-bottom:1px solid #e3e8ef;display:flex;justify-content:space-between}

.sum .g4 .lbl{font-size:12px;color:#5b6575}.sum .g4 .val{font-size:12px;font-weight:500;margin-top:3px}
@media (max-width:760px){.tiles,.sum .g4{grid-template-columns:minmax(0,1fr)}}

.crumb{border:0;background:none;padding:0;font:inherit;font-size:13px;color:#0a5bd3;cursor:pointer;margin:0 0 10px}
.crumb:hover{color:#0848a8;text-decoration:underline}
.lhead .sub{margin-top:4px;font-size:13px;color:#5b6575}
.filters select{height:32px;width:320px;max-width:100%;border:1px solid #c5ccd6;border-radius:4px;padding:0 10px;font:inherit;font-size:13px;background:#fff}
.accd{border:1px solid #dde2e9;border-radius:6px}
.accd-h{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-size:13px;border-top:1px solid #dde2e9}
.accd-h:first-child{border-top:0}
.chev{width:9px;height:9px;border-right:1.5px solid #2b3340;border-bottom:1.5px solid #2b3340;transform:rotate(45deg);margin-right:6px}
.chev.up{transform:rotate(-135deg)}
.accd-b{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 24px;padding:6px 32px 20px}
.accd-b .lbl{font-size:12px;color:#5b6575}.accd-b .val{font-size:12px;margin-top:3px}
@media (max-width:760px){.accd-b{grid-template-columns:minmax(0,1fr)}}
.pager{display:flex;justify-content:center;align-items:center;gap:16px;margin:16px 0 4px}
.pager .sbtn{background:#fff;color:#0a5bd3}
.pager .sbtn:disabled{border-color:#c5ccd6;color:#8a93a1;cursor:not-allowed}
.pager .pg{font-size:13px;color:#2b3340;min-width:96px;text-align:center}
/*icons*/.btn,.sbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;box-sizing:border-box;white-space:nowrap}.lact{flex-wrap:nowrap}.i{width:16px;height:16px;flex:none}.sbtn .i{width:14px;height:14px}.btn.small .i{width:14px;height:14px}.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}</style>
</head>

    <div class="notes">
    <h3>Notes for the OutSystems build</h3>
    <ul>
      <li>Unchanged from your current tab. Details opens Check Detail (its own screen: it has actions). Create New Check (Payroll Processor only) opens a new, not-yet-posted check.</li>
      <li>Gross to Net switches this tab to the Gross to Net list, as it does today.</li>

<script>
(function(){
  var HOLE=/\{\{([^}]*)\}\}/g;
  function get(scope,e){e=(e||'').trim();if(e==='true')return true;if(e==='false')return false;
    return e.split('.').reduce(function(a,k){return a==null?undefined:a[k];},scope);}
  function one(s){var m=(s||'').match(/^\s*\{\{([^}]*)\}\}\s*$/);return m?m[1]:null;}
  function interp(s,scope){return s.replace(HOLE,function(m,e){var v=get(scope,e);return v==null||v===false?'':String(v);});}
  function build(nodes,scope,out){
    for(var i=0;i<nodes.length;i++){var n=nodes[i];
