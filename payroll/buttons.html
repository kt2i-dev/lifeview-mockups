<title>Button standard</title>
<!-- LifeView Gateway payroll detail mockup. Standalone export of the claude.ai design canvas:
     open in any browser. The yellow "Mockup controls" strip only switches states; it is not part of the design. -->

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f3f5f8;font-family:Inter,system-ui,sans-serif;color:#1c2431}
a{color:#0a5bd3}a:hover{color:#0848a8}
.page{max-width:1240px;margin:0 auto;padding:16px 24px 48px;box-sizing:border-box}
.mock{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding:10px 14px;border:1px dashed #9aa4b2;border-radius:8px;background:#fffbe8;font-size:12px;color:#4a5361;margin-bottom:20px}
.mock-t{font-weight:600;color:#2b3340;letter-spacing:.05em;text-transform:uppercase;font-size:11px}
.mock-g{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid #c5ccd6;border-radius:6px;overflow:hidden}
.seg button{border:0;border-right:1px solid #c5ccd6;background:#fff;padding:0 12px;font:inherit;cursor:pointer;color:#2b3340;min-height:32px}
.seg button:last-child{border-right:0}
.seg button.on{background:#1c2431;color:#fff}
.seg button:disabled{color:#8a93a1;cursor:not-allowed;text-decoration:line-through}
.back{font-size:13px;text-decoration:none}
.titlebar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin:8px 0 20px}
h1{margin:0;font-size:24px;font-weight:600}
.sub{margin-top:4px;font-size:14px;color:#5b6575}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef1f5;color:#3a4350;font-size:12px;font-weight:600;margin-left:8px;vertical-align:middle}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:40px;padding:0 18px;border-radius:6px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;border:1px solid #0a5bd3;background:#fff;color:#0a5bd3;text-decoration:none;display:inline-flex;align-items:center;box-sizing:border-box}
.btn.primary{background:#0a5bd3;color:#fff}
.btn.danger{border-color:#b42318;color:#b42318}
.btn.danger-solid{background:#b42318;border-color:#b42318;color:#fff}
.btn.ghost{border-color:#b9c1cc;color:#2b3340}
.sep{width:1px;height:28px;background:#d3d9e1;margin:0 4px;align-self:center}
.card{background:#fff;border:1px solid #dde2e9;border-radius:10px;margin-bottom:16px}
.card h2{margin:0;padding:14px 20px;font-size:15px;font-weight:600;border-bottom:1px solid #e8ecf1}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 28px;padding:18px 20px 22px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.grid,.grid.c2,.grid.c4{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:12px;color:#5b6575;font-weight:500}
.req{color:#b42318;margin-left:3px}
.val{font-size:14px;min-height:20px;overflow-wrap:anywhere}
.val.muted{color:#5b6575;min-height:38px;display:flex;align-items:center}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.in{height:38px;border:1px solid #b9c1cc;border-radius:6px;padding:0 10px;font:inherit;font-size:14px;color:#1c2431;background:#fff;box-sizing:border-box;width:100%}
.in:focus{outline:2px solid #0a5bd3;outline-offset:-1px}
.help{font-size:12px;color:#5b6575}
.src{align-self:flex-start;font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#6b4500;background:#fffbe8;border:1px dashed #d9b75e;border-radius:4px;padding:1px 6px}
.radios{display:flex;flex-wrap:wrap;gap:6px 18px;min-height:38px;align-items:center}
.radio{display:flex;gap:6px;align-items:center;font-size:14px}
.banner{padding:12px 16px;border-radius:8px;background:#e7f4ec;border:1px solid #9fd3b4;color:#14532d;font-size:14px;margin-bottom:16px}
.editing{padding:10px 16px;border-radius:8px;background:#eaf1fd;border:1px solid #b6cdf5;color:#173f84;font-size:14px;margin-bottom:16px}
.warn{padding:10px 16px;border-radius:8px;background:#fff6e5;border:1px solid #f1cf8f;color:#6b4500;font-size:14px;margin-bottom:16px}
.err{padding:12px 16px;border-radius:8px;background:#fdecea;border:1px solid #f1aeb5;color:#7a1a12;font-size:14px;margin-bottom:16px}
.err .host{display:block;margin-top:4px;font-size:12px;color:#8c2f26}
.dialog .host{display:block;margin-top:6px;font-size:12px;color:#5b6575}
.titlebar.sticky{position:sticky;top:0;z-index:5;background:#f3f5f8;padding:12px 0;margin-top:0;border-bottom:1px solid #dde2e9}
.exc{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#3a4350;margin-right:4px}
.exc .opts{display:inline-flex;border:1px solid #b9c1cc;border-radius:6px;overflow:hidden}
.exc .opts button{border:0;border-right:1px solid #b9c1cc;background:#fff;font:inherit;font-size:12px;padding:0 10px;min-height:32px;cursor:pointer;color:#2b3340}
.exc .opts button:last-child{border-right:0}
.exc .opts button.on{background:#0a5bd3;color:#fff}
.btn:not(.primary) .spin{border-color:rgba(10,91,211,.25);border-top-color:#0a5bd3}
.err .err-btn{margin-top:10px;min-height:32px;padding:0 12px;font-size:13px;border-color:#7a1a12;color:#7a1a12;background:#fff}
.loadbox{display:flex;gap:10px;align-items:center;justify-content:center;padding:36px 16px;color:#5b6575;font-size:14px}
.loadbox .spin{border-color:rgba(10,91,211,.25);border-top-color:#0a5bd3}
td.empty{text-align:center;color:#5b6575;padding:18px 10px}
.nores{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px 36px;font-size:13px;color:#2b3340}
.nores-i{width:72px;height:72px;color:#9aa4b2}
.nores-i.warn-i{color:#c77700}
.notes{background:#f8fafc;border:1px dashed #b9c1cc;border-radius:10px;padding:14px 20px 16px;font-size:13px;color:#3a4350;line-height:1.55;margin-top:28px}
.notes h3{margin:0 0 6px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#5b6575}
.notes ul{margin:0;padding-left:18px}
.overlay{position:fixed;inset:0;background:rgba(20,26,36,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dialog{background:#fff;border-radius:10px;max-width:460px;width:100%;padding:22px 24px;box-sizing:border-box}
.dialog h2{margin:0 0 8px;font-size:18px}
.dialog p{margin:0 0 18px;font-size:14px;color:#3a4350;line-height:1.5}
.tblwrap{overflow-x:auto;padding:4px 20px 20px}
table.acc{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
table.acc th{background:#0a5bd3;color:#fff;text-align:left;font-weight:600;font-size:12px;padding:10px 12px}
table.acc th.num{text-align:right}
table.acc td{padding:10px 12px;border-bottom:1px solid #e8ecf1}
table.acc td.num{text-align:right;font-variant-numeric:tabular-nums}
table.acc td.na{text-align:right;color:#8a93a1}
table.acc tr.group td{background:#f3f6fa;font-size:12px;font-weight:600;color:#3a4350;letter-spacing:.03em;text-transform:uppercase;padding:8px 12px}
table.acc tr.total td{font-weight:600}

.page{max-width:1440px}
.ptitle{margin:6px 0 16px;font-size:22px;font-weight:700}
.shell{background:#fff;border-radius:10px;padding:24px 26px 32px}
.emp{border:1px solid #dde2e9;border-left:4px solid #0a5bd3;border-radius:8px;padding:12px 20px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.emp .nm{font-size:18px;font-weight:700}
.emp .k{font-size:12px;color:#8a93a1}.emp .v{font-size:13px;font-weight:600;margin-left:4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:16px 0 18px}
.tile{border:1px solid #dde2e9;border-radius:6px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:14px;color:#2b3340;background:#fff}
.tile .ic{color:#0a5bd3;font-size:16px}
.tile.on{background:#e3edfb;border-color:#0a5bd3;color:#0a5bd3}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid #d3d9e1;margin-bottom:22px}
.tabs button{border:0;background:none;font:inherit;font-size:13px;color:#2b3340;padding:10px 13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{border-bottom-color:#1c2431;font-weight:600}
.lhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.lhead h2{margin:0;font-size:16px;font-weight:700}
.sbtn{min-height:32px;padding:0 14px;border-radius:4px;font:inherit;font-size:12px;cursor:pointer;border:1px solid #0a5bd3;background:#0a5bd3;color:#fff;text-decoration:none;display:inline-flex;align-items:center;box-sizing:border-box}
.sbtn.out{background:#fff;color:#0a5bd3}
.filters{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#3a4350}
.filters input{height:32px;width:320px;max-width:100%;border:1px solid #c5ccd6;border-radius:4px;padding:0 10px;font:inherit;font-size:13px;box-sizing:border-box}
table.list{border-collapse:collapse;width:100%;font-size:12px}
table.list th{background:#0a5bd3;color:#fff;text-align:left;font-weight:600;padding:12px 10px}
table.list td{padding:7px 10px;border-bottom:1px solid #e3e8ef;height:30px}
table.list tbody tr:nth-child(even) td{background:#eaf1fb}
.lact{display:flex;gap:12px}
.lact .sbtn{background:#fff;color:#0a5bd3}
.muted{color:#8a93a1}
.ltbl{overflow-x:auto}
.sum{border:1px solid #dde2e9;border-radius:8px;margin-bottom:14px}
.sum .hd{padding:14px 18px;font-size:13px;border-bottom:1px solid #e3e8ef;display:flex;justify-content:space-between}
.sum .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 24px;padding:16px 32px 20px}
.sum .g4 .lbl{font-size:12px;color:#5b6575}.sum .g4 .val{font-size:12px;font-weight:500;margin-top:3px}
@media (max-width:760px){.tiles,.sum .g4{grid-template-columns:minmax(0,1fr)}}

.crumb{border:0;background:none;padding:0;font:inherit;font-size:13px;color:#0a5bd3;cursor:pointer;margin:0 0 10px}
.crumb:hover{color:#0848a8;text-decoration:underline}
.lhead .sub{margin-top:4px;font-size:13px;color:#5b6575}
.filters select{height:32px;width:320px;max-width:100%;border:1px solid #c5ccd6;border-radius:4px;padding:0 10px;font:inherit;font-size:13px;background:#fff}
.accd{border:1px solid #dde2e9;border-radius:6px}
.accd-h{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-size:13px;border-top:1px solid #dde2e9}
.accd-h:first-child{border-top:0}
.chev{width:9px;height:9px;border-right:1.5px solid #2b3340;border-bottom:1.5px solid #2b3340;transform:rotate(45deg);margin-right:6px}
.chev.up{transform:rotate(-135deg)}
.accd-b{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 24px;padding:6px 32px 20px}
.accd-b .lbl{font-size:12px;color:#5b6575}.accd-b .val{font-size:12px;margin-top:3px}
@media (max-width:760px){.accd-b{grid-template-columns:minmax(0,1fr)}}
.pager{display:flex;justify-content:center;align-items:center;gap:16px;margin:16px 0 4px}
.pager .sbtn{background:#fff;color:#0a5bd3}
.pager .sbtn:disabled{border-color:#c5ccd6;color:#8a93a1;cursor:not-allowed}
.pager .pg{font-size:13px;color:#2b3340;min-width:96px;text-align:center}
.std td{vertical-align:middle}/*icons*/.btn,.sbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;box-sizing:border-box;white-space:nowrap}.lact{flex-wrap:nowrap}.i{width:16px;height:16px;flex:none}.sbtn .i{width:14px;height:14px}.btn.small .i{width:14px;height:14px}.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}</style>
</head>
<body>
<style>.mock-home{display:flex;justify-content:flex-end;max-width:1440px;margin:0 auto;padding:10px 24px 0;box-sizing:border-box;font:14px Inter,system-ui,sans-serif}.mock-home a{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px dashed #9aa4b2;border-radius:8px;background:#fffbe8;color:#2b3340;text-decoration:none;font-weight:600}.mock-home a:hover{border-color:#0a5bd3;color:#0a5bd3}</style><nav class="mock-home" aria-label="Mockup navigation"><a href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Mockups home</a></nav>
<template id="dc-template">
<div class="page">
  <div class="titlebar"><div><h1>Button standard</h1><div class="sub">One icon + label per action, same place on every screen. Special one-off buttons (Gross to Net, Create New Check, Calculate, Post, Reverse Check) stay as plain buttons.</div></div></div>
  <section class="card" id="standard"><div class="tblwrap" style="padding-top:16px"><table class="acc std">
    <thead><tr><th scope="col">Button</th><th scope="col">Name</th><th scope="col">Where it goes</th><th scope="col">Built as</th><th scope="col">Icon widget name*</th></tr></thead><tbody>
<tr><td><a class="sbtn out" href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>Details</a></td><td>Details</td><td>Every list Actions column, first button. Opens the record’s detail screen.</td><td><code>ButtonDetails</code> block</td><td><code>eye</code></td></tr>
<tr><td><a class="sbtn out" href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Accumulator</a></td><td>Accumulator</td><td>List Actions column, after Details, where the legacy list links one. Opens inside the tab. As “Accumulators” in the CalPERS list header, it switches the tab to the PERS Accumulators list.</td><td><code>ButtonAccumulator</code> block</td><td><code>database</code></td></tr>
<tr><td><a class="sbtn out" href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download</a></td><td>Download</td><td>List Actions column where the row is a document (W2s).</td><td><code>ButtonDownload</code> block</td><td><code>download</code></td></tr>
<tr><td><a class="sbtn" href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add</a></td><td>Add</td><td>Top right of a list, where the legacy screen can add. Hidden for read-only roles.</td><td><code>ButtonAdd</code> block</td><td><code>plus</code></td></tr>
<tr><td><button type="button" class="btn primary"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5l4 4L8 20H4v-4L16.5 3.5z"/><path d="M14 6l4 4"/></svg>Edit</button></td><td>Edit</td><td>Detail header (<code>StickyPageHeader</code>’s ButtonPlaceholder) in View, where the legacy screen can update.</td><td><code>ButtonEdit</code> block</td><td><code>pencil</code></td></tr>
<tr><td><button type="button" class="btn danger"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Delete</button></td><td>Delete</td><td>Detail screen, Edit mode only, left of Cancel. Always confirms, naming the record (“Delete deduction 068 effective 08/08/2026?”).</td><td><code>ButtonDelete</code> block</td><td><code>trash</code></td></tr>
<tr><td><a class="back" href="#">← Back</a></td><td>← Back</td><td>Built into <code>StickyPageHeader</code> on every detail screen: handle its event with the screen’s existing back client action. Its text is the optional <code>BackLabel</code> (blank = “Back”). Returns to the list or tab the user came from. Name the screen it returns to with <code>BackLabel</code> where that helps: “← Back to Check History”. In-tab views (Gross to Net, the accumulators) use the same wording.</td><td>Link (breadcrumb)</td><td><code>—</code></td></tr>
<tr><td><button type="button" class="btn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>Cancel</button></td><td>Cancel</td><td>Left of Add / Update on every form and dialog. On an existing record it leaves edit mode and resets the values; on a new one it returns to the list.</td><td><code>ButtonCancel</code> block</td><td><code>prohibit</code></td></tr>
<tr><td><button type="button" class="btn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add</button></td><td>Add (form)</td><td>Saves the form as a NEW row (POST). Primary and rightmost when adding; outlined, left of Update, when editing a record where LifeView offers both. Button Loading while it runs (“Adding…”).</td><td>In the form, not a block: it has to run the form’s validation</td><td><code>plus</code></td></tr>
<tr><td><button type="button" class="btn primary"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3"/><circle cx="12" cy="15" r="2.5"/></svg>Update</button></td><td>Update</td><td>Saves this record in place (PUT). Rightmost while editing. Button Loading while it runs (“Updating…”), disabled until it finishes.</td><td>In the form, not a block: it has to run the form’s validation</td><td><code>floppy-o</code></td></tr>
<tr><td><span class="exc"><span class="opts"><button type="button" class="on">Return Exceptions</button><button type="button">Override Exceptions</button></span></span></td><td>Return | Override Exceptions</td><td>Detail header while editing or adding, leftmost, on screens whose endpoint takes <code>overrideExceptions</code> (LifeView’s Submit Options). Return by default; resets every time the form opens and after each save.</td><td>Toggle in the form</td><td><code>—</code></td></tr>
<tr><td><button type="button" class="btn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Previous</button></td><td>Previous</td><td>Multi-step forms (New Hire, Change form): left side.</td><td>In the form, not a block: it has to run the form’s validation</td><td><code>arrow-left</code></td></tr>
<tr><td><button type="button" class="btn primary"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Next</button></td><td>Next</td><td>Multi-step forms: right side; on the last step Add (or Update) takes its place.</td><td>In the form, not a block: it has to run the form’s validation</td><td><code>arrow-right</code></td></tr>
<tr><td><button type="button" class="btn primary"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</button></td><td>Search</td><td>Filter rows, after the inputs. Runs the filter (the list goes back to page 1).</td><td><code>ButtonSearch</code> block</td><td><code>magnifying glass</code></td></tr>
<tr><td><button type="button" class="btn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>Reset</button></td><td>Reset</td><td>Filter rows, right of Search. Clears the filter and reloads the list.</td><td><code>ButtonReset</code> block</td><td><code>prohibit</code></td></tr>
<tr><td><div class="pager" style="justify-content:flex-start;margin:0"><button type="button" class="sbtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Previous</button><span class="pg">Page 2</span><button type="button" class="sbtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Next</button></div></td><td>Pager</td><td>Centered under every paged gateway list: outlined Previous / Next with “Page n” between them, “Page n of n” on the last page (the API gives no total). Previous shows only after page 1 and Next only while <code>hasMore</code>: hidden, not disabled. The same block draws the list’s loading spinner, its empty message and, when the call fails (<code>IsError</code>), a warning icon over the error message (see Custom widgets). An OutSystems aggregate uses the standard OutSystems pagination.</td><td><code>APIPagination</code> block</td><td><code>arrow-left / arrow-right</code></td></tr>
    </tbody></table></div></section>
  <p class="sub" style="margin:-4px 0 16px">* The icon names the button blocks use in ODC. Add (form), Update, Previous and Next aren’t blocks: <code>floppy-o</code> and the arrows are Font Awesome 4.7 names, not yet checked in ODC Studio’s icon picker.</p>
  <section class="card" id="blocks"><h2>The button blocks</h2><div class="grid c2">
    <div class="f"><span class="lbl">Inputs</span><span class="val"><code>IsEnabled</code> (Boolean, mandatory) and <code>ExtendedClass</code> (Text, optional).</span></div>
    <div class="f"><span class="lbl">Event</span><span class="val"><code>Clicked</code>, no parameters. Navigation goes in the parent’s handler (e.g. <code>Details_OnClick</code>).</span></div>
    <div class="f"><span class="lbl">Why Add, Update, Previous and Next aren’t blocks</span><span class="val">The blocks don’t run form validation, so these stay as plain buttons inside the form. Add and Update use OutSystems UI’s Button Loading.</span></div>
    <div class="f"><span class="lbl">In a table</span><span class="val">Every list table has the <code>app-table</code> class: the header in the theme’s primary color (<code>--color-primary</code>, as <code>btn-primary</code> uses), row striping and the small row buttons. Inside an <code>app-table</code> cell the button blocks pick those up (outlined, small). A sorted or hovered header keeps white text; the sorted column is also bold with a 4px white bottom border (the theme fixes OutSystems UI turning it blue on the blue header).</span></div>
  </div></section>
  <section class="card" id="save"><h2>Which save button</h2><div class="tblwrap" style="padding-top:4px"><table class="acc std">
    <thead><tr><th scope="col">The screen’s endpoint</th><th scope="col">While editing</th><th scope="col">Examples</th></tr></thead><tbody>
      <tr><td>Can add and update (POST + PUT)</td><td><strong>Add</strong> · <strong>Update</strong> (Update primary). Adding a new record: <strong>Add</strong> alone.</td><td>Direct Deposit, CalPERS IDs, Work Location, Personal Data</td></tr>
      <tr><td>Update only (PUT, no POST)</td><td><strong>Update</strong> alone</td><td>Pay Status, Check Distribution, Time Sheet Control</td></tr>
      <tr><td>Add only (POST, no PUT: a change is a new dated row)</td><td><strong>Add</strong> alone</td><td>HR Status / Compensation / Position</td></tr>
    </tbody></table>
    <p class="sub" style="padding:0 20px 16px;margin:0">There’s no Save button. Update saves this record in place; Add saves a new one. They’re LifeView’s own labels, so users see the words they know, and where both show each says what it does. A screen shows only the buttons its endpoint supports.</p></div></section>
  <section class="card" id="placement"><h2>Placement</h2><div class="grid">
    <div class="f"><span class="lbl">List header</span><span class="val">Title left; Add (and any special buttons) right.</span></div>
    <div class="f"><span class="lbl">List rows</span><span class="val">Actions is always the last column: Details, then Accumulator / Download.</span></div>
    <div class="f"><span class="lbl">List footer</span><span class="val">Pager centered under the table: Previous · Page n · Next.</span></div>
    <div class="f"><span class="lbl">Detail header</span><span class="val">The <code>StickyPageHeader</code> block: title and subtitle as its <code>Title</code> / <code>Subtitle</code> inputs, actions in ButtonPlaceholder, ← Back built in; it stays in view while the page scrolls. View: Edit. Edit: Exceptions · Delete | Cancel, Add, Update. Add: Exceptions · Cancel, Add. Update-only screens: no Add. See the <a href="detail-template.html">Details/Edit Screen Template</a>.</span></div>
  </div></section>

<div id="dc-root"></div>
<script>
(function(){
  var HOLE=/\{\{([^}]*)\}\}/g;
  function get(scope,e){e=(e||'').trim();if(e==='true')return true;if(e==='false')return false;
    return e.split('.').reduce(function(a,k){return a==null?undefined:a[k];},scope);}
  function one(s){var m=(s||'').match(/^\s*\{\{([^}]*)\}\}\s*$/);return m?m[1]:null;}
  function interp(s,scope){return s.replace(HOLE,function(m,e){var v=get(scope,e);return v==null||v===false?'':String(v);});}
  function build(nodes,scope,out){
    for(var i=0;i<nodes.length;i++){var n=nodes[i];
      if(n.nodeType===3){out.appendChild(document.createTextNode(interp(n.data,scope)));continue;}
      if(n.nodeType!==1)continue;
      if(n.tagName==='TEMPLATE'&&n.hasAttribute('data-sc-if')){if(get(scope,one(n.getAttribute('value'))))build(n.content.childNodes,scope,out);continue;}
      if(n.tagName==='TEMPLATE'&&n.hasAttribute('data-sc-for')){
        var list=get(scope,one(n.getAttribute('list')))||[],as=n.getAttribute('as');
        list.forEach(function(item){var sc=Object.create(scope);sc[as]=item;build(n.content.childNodes,sc,out);});continue;}
      var el=n.cloneNode(false),post=[];
      Array.prototype.slice.call(el.attributes).forEach(function(a){
        var nm=a.name,v=a.value;
        if(nm.indexOf('hint-placeholder')===0){el.removeAttribute(nm);return;}
        if(v.indexOf('{{')<0)return;
        if(nm.slice(0,2)==='on'){el.removeAttribute(nm);var fn=get(scope,one(v));if(typeof fn==='function')el.addEventListener(nm.slice(2),fn);return;}
        if(nm==='defaultvalue'){el.removeAttribute(nm);var dv=get(scope,one(v));post.push(function(){el.value=dv==null?'':dv;});return;}
        if(nm==='defaultchecked'){el.removeAttribute(nm);el.checked=!!get(scope,one(v));return;}
        el.setAttribute(nm,interp(v,scope));
      });
      build(n.childNodes,scope,el);post.forEach(function(f){f();});out.appendChild(el);
    }
  }
  var tpl=document.getElementById('dc-template'),root=document.getElementById('dc-root'),comp;
  window.DCLogic=function(props){this.props=props||{};this.state={};};
  window.DCLogic.prototype.setState=function(o){Object.assign(this.state,o);render();};
  window.DCLogic.prototype.renderVals=function(){return {};};
  function render(){var y=window.scrollY;root.replaceChildren();build(tpl.content.childNodes,comp.renderVals(),root);window.scrollTo(0,y);}
  window.__dcMount=function(C){var q={};new URLSearchParams(location.search).forEach(function(v,k){q[k]=v;});comp=new C({query:q});render();
    if(location.hash){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}};
})();
</script>
<script>
class Component extends DCLogic {
  renderVals() { return {}; }
}

__dcMount(Component);
</script>
