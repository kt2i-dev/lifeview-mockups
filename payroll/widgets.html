<style>
body{margin:0;background:#f3f5f8;font-family:Inter,system-ui,sans-serif;color:#1c2431}
a{color:#0a5bd3}a:hover{color:#0848a8}
.page{max-width:1240px;margin:0 auto;padding:16px 24px 48px;box-sizing:border-box}
.mock{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding:10px 14px;border:1px dashed #9aa4b2;border-radius:8px;background:#fffbe8;font-size:12px;color:#4a5361;margin-bottom:20px}
.mock-t{font-weight:600;color:#2b3340;letter-spacing:.05em;text-transform:uppercase;font-size:11px}
.mock-g{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid #c5ccd6;border-radius:6px;overflow:hidden}

.seg button:last-child{border-right:0}
.seg button.on{background:#1c2431;color:#fff}

.back{font-size:13px;text-decoration:none}
.titlebar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin:8px 0 20px}
h1{margin:0;font-size:24px;font-weight:600}
.sub{margin-top:4px;font-size:14px;color:#5b6575}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef1f5;color:#3a4350;font-size:12px;font-weight:600;margin-left:8px;vertical-align:middle}

.btn{min-height:40px;padding:0 18px;border-radius:6px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;border:1px solid #0a5bd3;background:#fff;color:#0a5bd3;text-decoration:none;display:inline-flex;align-items:center;box-sizing:border-box}
.btn.primary{background:#0a5bd3;color:#fff}
.btn.danger{border-color:#b42318;color:#b42318}
.btn.danger-solid{background:#b42318;border-color:#b42318;color:#fff}
.btn.ghost{border-color:#b9c1cc;color:#2b3340}
.sep{width:1px;height:28px;background:#d3d9e1;margin:0 4px;align-self:center}
.card{background:#fff;border:1px solid #dde2e9;border-radius:10px;margin-bottom:16px}
.card h2{margin:0;padding:14px 20px;font-size:15px;font-weight:600;border-bottom:1px solid #e8ecf1}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 28px;padding:18px 20px 22px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}

.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:12px;color:#5b6575;font-weight:500}
.req{color:#b42318;margin-left:3px}
.val{font-size:14px;min-height:20px;overflow-wrap:anywhere}
.val.muted{color:#5b6575;min-height:38px;display:flex;align-items:center}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.in{height:38px;border:1px solid #b9c1cc;border-radius:6px;padding:0 10px;font:inherit;font-size:14px;color:#1c2431;background:#fff;box-sizing:border-box;width:100%}
.in:focus{outline:2px solid #0a5bd3;outline-offset:-1px}
.help{font-size:12px;color:#5b6575}

.radios{display:flex;flex-wrap:wrap;gap:6px 18px;min-height:38px;align-items:center}
.radio{display:flex;gap:6px;align-items:center;font-size:14px}
.banner{padding:12px 16px;border-radius:8px;background:#e7f4ec;border:1px solid #9fd3b4;color:#14532d;font-size:14px;margin-bottom:16px}

.warn{padding:10px 16px;border-radius:8px;background:#fff6e5;border:1px solid #f1cf8f;color:#6b4500;font-size:14px;margin-bottom:16px}
.err{padding:12px 16px;border-radius:8px;background:#fdecea;border:1px solid #f1aeb5;color:#7a1a12;font-size:14px;margin-bottom:16px}

/*icons*/.btn,.sbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;box-sizing:border-box;white-space:nowrap}.lact{flex-wrap:nowrap}.i{width:16px;height:16px;flex:none}.sbtn .i{width:14px;height:14px}.btn.small .i{width:14px;height:14px}.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}</style>

<body>
<style>.mock-home{display:flex;justify-content:flex-end;max-width:1440px;margin:0 auto;padding:10px 24px 0;box-sizing:border-box;font:12px Inter,system-ui,sans-serif}.mock-home a{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px dashed #9aa4b2;border-radius:6px;background:#fffbe8;color:#2b3340;text-decoration:none;font-weight:600}.mock-home a:hover{border-color:#0a5bd3;color:#0a5bd3}</style><nav class="mock-home" aria-label="Mockup navigation"><a href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Mockups home</a></nav>
<template id="dc-template">
<div class="page">
  <div class="titlebar"><div><h1>Custom widgets</h1><div class="sub">The shared blocks in CustomWidgets, what they take and when to use them. Don’t change them for one screen: fix the block or ask. The button blocks are on the <a href="buttons.html">Button standard</a>.</div></div></div>
  <section class="wd" id="CodeTableDropdown"><div class="wd-h"><h2><code>CodeTableDropdown</code></h2><p>The dropdown for every coded field on an edit form. Loads the code table from the gateway (<code>/v1/codes/{table}</code>).</p></div><div class="wd-b"><div class="demo"><span class="demo-t">Closed</span><div><div class="dd-l">Location</div><div class="dd"><span>CITY HALL</span><span class="ctl"><span aria-hidden="true">×</span><span aria-hidden="true">⌄</span></span></div></div><span class="demo-t">Open: search, description with the code under it</span><div><div class="dd-l">Location</div><div class="dd open"><span>CITY HALL</span><span class="ctl"><span aria-hidden="true">×</span><span aria-hidden="true">⌃</span></span></div><div class="dd-menu"><div class="dd-s">⌕ Search…</div><div class="dd-o on">CITY HALL<small>CHL</small></div><div class="dd-o">CITY SAFETY &amp; WORKERS COMP<small>CSO</small></div><div class="dd-o">COLLABORATIVE RESPONSE DIVISION<small>CRD</small></div></div></div></div><div class="spec"><dl><dt>Inputs</dt><dd><ul><li><code>Table</code> (CodeTables identifier) and <code>Code_Input</code> (Text): mandatory</li><li><code>Qualifier</code>: only for a two-key table (e.g. the benefit plan’s affiliation)</li><li><code>IsRequired</code>, <code>IsValid</code>, <code>IsValidating</code>, <code>ValidationMessage</code>: the red border and message</li><li><code>IsEnabled</code>, <code>IsReadOnly</code>, <code>DropdownLabel</code>, <code>TabIndex</code>, <code>NextTabIndex</code></li></ul></dd><dt>Event</dt><dd><code>CodeSelected(Code)</code>. Wire it on every use: the handler sets the record’s field (e.g. <code>TaxEntitySelected</code> sets <code>EditForm.taxEntityCode</code>). Focus then moves to <code>NextTabIndex</code>.</dd><dt>Shows</dt><dd>A searchable list sorted by description, the code under each one; a red asterisk when required. In read-only mode, the description alone.</dd><dt>Use it</dt><dd><ul><li>In the edit branch of the field’s If on <code>IsEditing</code>. In View show the description the GET already returns as plain text: <code>IsReadOnly</code> runs a lookup per field.</li><li>A field with no code table (Bureau, Division, Region) is a plain text input.</li><li>Don’t change the block for one screen: it’s used in about 97 places.</li></ul></dd></dl></div></div></section>
  <section class="wd" id="IncentiveCodeDropdown"><div class="wd-h"><h2><code>IncentiveCodeDropdown</code></h2><p>The same dropdown for the City’s 30 incentive (Additional Pay) codes, from <code>/v1/hr/incentive-codes</code>.</p></div><div class="wd-b"><div class="demo"><div><div class="dd-l">Incentive Code</div><div class="dd"><span>AUTO ALLOWANCE</span><span class="ctl"><span aria-hidden="true">×</span><span aria-hidden="true">⌄</span></span></div></div></div><div class="spec"><dl><dt>Inputs</dt><dd><code>Code_Input</code> (mandatory) plus the same optional inputs as CodeTableDropdown. No <code>Table</code>; <code>Qualifier</code> isn’t used.</dd><dt>Event</dt><dd><code>CodeSelected(IncentiveCode)</code> passes the whole <code>HRIncentiveCode_GetResponse</code> (rate, amount source, payment defaults), not just the code, so the form can fill the amount and defaults.</dd><dt>Shows</dt><dd>The label “Incentive Code” (fixed in the block) and the same searchable list.</dd><dt>Use it</dt><dd>Additional Pay detail, the HR1 Request and the New Hire Request: anywhere HR picks an incentive payment.</dd></dl></div></div></section>
  <section class="wd" id="CodeTableText"><div class="wd-h"><h2><code>CodeTableText</code></h2><p>Shows the description for a code stored in OutSystems, looked up live. <strong>Only for the HR1 and New Hire request flows.</strong></p></div><div class="wd-b"><div class="demo"><div><div class="dd-l">Location</div><div class="txt">CITY HALL</div></div></div><div class="spec"><dl><dt>Inputs</dt><dd><code>Table</code> and <code>Code</code> (mandatory), <code>Qualifier</code>, <code>Label</code>.</dd><dt>Events</dt><dd>None.</dd><dt>Shows</dt><dd>An optional label, then the description. Blank when <code>Code</code> is empty.</dd><dt>Use it</dt><dd><ul><li>HR1 and New Hire store only the codes, so their detail screens look each one up (one call per field, rerun whenever an input changes). HRMS stores codes the same way.</li><li>Everywhere else the gateway GET already returns the description: show that as plain text instead.</li></ul></dd></dl></div></div></section>
  <section class="wd" id="DateExpression"><div class="wd-h"><h2><code>DateExpression</code></h2><p>Every date shown as text: list columns and detail screens in View.</p></div><div class="wd-b"><div class="demo"><div class="txt">04/21/2023</div><span class="demo-t">Null date</span><div class="txt" style="min-height:20px"></div></div><div class="spec"><dl><dt>Inputs</dt><dd><code>Date</code> (mandatory), <code>ExtendedClass</code>.</dd><dt>Events</dt><dd>None.</dd><dt>Shows</dt><dd>MM/dd/yyyy, never wrapping. Blank for a null date (OutSystems’ null date is 01/01/1900, the gateway’s “no date”).</dd><dt>Use it</dt><dd>For every displayed date, so null dates are blank everywhere: no N/A, no placeholder date.</dd></dl></div></div></section>
  <section class="wd" id="EffectiveDateFilter"><div class="wd-h"><h2><code>EffectiveDateFilter</code></h2><p>The Effective Date filter row above a payroll list, with its Search and Reset buttons.</p></div><div class="wd-b"><div class="demo"><div class="fbar"><label>Effective Date<span class="date">mm/dd/yyyy</span></label><button type="button" class="sbtn">Search</button><button type="button" class="sbtn out">Reset</button></div></div><div class="spec"><dl><dt>Inputs</dt><dd>None.</dd><dt>Event</dt><dd><code>DateSelected(Date)</code>. Search sends the date in the box; Reset clears the box and sends an empty date (= every record).</dd><dt>Use it</dt><dd>The handler stores the date, sets the list’s StartIndex back to 0 and refreshes it. The date goes to the list’s <code>asOf</code>.</dd></dl></div></div></section>
  <section class="wd" id="APIPagination"><div class="wd-h"><h2><code>APIPagination</code></h2><p>Paging, loading and empty state for every list read from the gateway. Lists from an OutSystems aggregate use the standard OutSystems pagination.</p></div><div class="wd-b"><div class="demo"><span class="demo-t">Middle page</span><nav class="pager"><button type="button" class="sbtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Previous</button><span class="pg">Page 2</span><button type="button" class="sbtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Next</button></nav><span class="demo-t">Last page</span><nav class="pager"><button type="button" class="sbtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Previous</button><span class="pg">Page 3 of 3</span></nav><span class="demo-t">Loading (IsSearching)</span><div class="loadbox" role="status"><span class="spin" aria-hidden="true"></span>Loading…</div><span class="demo-t">Empty (IsEmpty)</span><div class="nores"><svg class="nores-i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></svg>No results found matching search criteria.</div></div><div class="spec"><dl><dt>Inputs</dt><dd>All mandatory: <code>IsSearching</code>, <code>IsEmpty</code>, <code>StartIndex</code>, <code>PageSize</code>, <code>HasMore</code>.</dd><dt>Events</dt><dd><code>NextPage</code>, <code>PreviousPage</code>: the parent adds or subtracts PageSize from StartIndex and refreshes.</dd><dt>Shows</dt><dd>A spinner while searching, the empty message when there are no rows, otherwise Previous (after page 1) · “Page n” (“Page n of n” on the last page) · Next (while HasMore).</dd><dt>Wiring</dt><dd><ul><li>Send StartIndex as <code>skip</code> and PageSize as <code>pageSize</code> on the gateway call. If <code>pageSize</code> isn’t sent the gateway uses the list’s own default (25 or 50), and pages overlap.</li><li><code>HasMore</code> = the response’s <code>hasMore</code>; <code>IsSearching</code> = not yet fetched; <code>IsEmpty</code> = no rows.</li><li>StartIndex back to 0 when a filter changes.</li></ul></dd></dl></div></div></section>
</div>

<div id="dc-root"></div>
<script>
(function(){
  var HOLE=/\{\{([^}]*)\}\}/g;
  function get(scope,e){e=(e||'').trim();if(e==='true')return true;if(e==='false')return false;
    return e.split('.').reduce(function(a,k){return a==null?undefined:a[k];},scope);}
  function one(s){var m=(s||'').match(/^\s*\{\{([^}]*)\}\}\s*$/);return m?m[1]:null;}
  function interp(s,scope){return s.replace(HOLE,function(m,e){var v=get(scope,e);return v==null||v===false?'':String(v);});}
  function build(nodes,scope,out){
    for(var i=0;i<nodes.length;i++){var n=nodes[i];
      if(n.nodeType===3){out.appendChild(document.createTextNode(interp(n.data,scope)));continue;}
      if(n.nodeType!==1)continue;
      if(n.tagName==='TEMPLATE'&&n.hasAttribute('data-sc-if')){if(get(scope,one(n.getAttribute('value'))))build(n.content.childNodes,scope,out);continue;}
      if(n.tagName==='TEMPLATE'&&n.hasAttribute('data-sc-for')){
        var list=get(scope,one(n.getAttribute('list')))||[],as=n.getAttribute('as');
        list.forEach(function(item){var sc=Object.create(scope);sc[as]=item;build(n.content.childNodes,sc,out);});continue;}
      var el=n.cloneNode(false),post=[];
      Array.prototype.slice.call(el.attributes).forEach(function(a){
        var nm=a.name,v=a.value;
        if(nm.indexOf('hint-placeholder')===0){el.removeAttribute(nm);return;}
        if(v.indexOf('{{')<0)return;
        if(nm.slice(0,2)==='on'){el.removeAttribute(nm);var fn=get(scope,one(v));if(typeof fn==='function')el.addEventListener(nm.slice(2),fn);return;}
        if(nm==='defaultvalue'){el.removeAttribute(nm);var dv=get(scope,one(v));post.push(function(){el.value=dv==null?'':dv;});return;}
        if(nm==='defaultchecked'){el.removeAttribute(nm);el.checked=!!get(scope,one(v));return;}
        el.setAttribute(nm,interp(v,scope));
      });
      build(n.childNodes,scope,el);post.forEach(function(f){f();});out.appendChild(el);
    }
  }
  var tpl=document.getElementById('dc-template'),root=document.getElementById('dc-root'),comp;
  window.DCLogic=function(props){this.props=props||{};this.state={};};
  window.DCLogic.prototype.setState=function(o){Object.assign(this.state,o);render();};
  window.DCLogic.prototype.renderVals=function(){return {};};
  function render(){var y=window.scrollY;root.replaceChildren();build(tpl.content.childNodes,comp.renderVals(),root);window.scrollTo(0,y);}
  window.__dcMount=function(C){var q={};new URLSearchParams(location.search).forEach(function(v,k){q[k]=v;});comp=new C({query:q});render();};
})();
</script>
<script>
class Component extends DCLogic {
  renderVals() { return {}; }
}

__dcMount(Component);
</script>
