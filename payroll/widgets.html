<style>
body{margin:0;background:#f3f5f8;font-family:Inter,system-ui,sans-serif;color:#1c2431}
a{color:#0a5bd3}a:hover{color:#0848a8}

<style>.mock-home{display:flex;justify-content:flex-end;max-width:1440px;margin:0 auto;padding:10px 24px 0;box-sizing:border-box;font:12px Inter,system-ui,sans-serif}.mock-home a{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px dashed #9aa4b2;border-radius:6px;background:#fffbe8;color:#2b3340;text-decoration:none;font-weight:600}.mock-home a:hover{border-color:#0a5bd3;color:#0a5bd3}</style><nav class="mock-home" aria-label="Mockup navigation"><a href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Mockups home</a></nav>
<template id="dc-template">
<div class="page">
  <div class="titlebar"><div><h1>Custom widgets</h1><div class="sub">The shared blocks in CustomWidgets, what they take and when to use them. Don’t change them for one screen: fix the block or ask. The button blocks are on the <a href="buttons.html">Button standard</a>.</div></div></div>
  <section class="wd" id="StickyPageHeader"><div class="wd-h"><h2><code>StickyPageHeader</code></h2><p>The header of every detail and edit screen. It stays in view while the user scrolls, so the buttons are always visible.</p></div><div class="wd-b"><div class="demo"><div class="sph"><div class="sph-l"><a class="back" href="#">← Back</a><div><div class="sph-t">Tax Control</div><div class="sph-s">Federal · effective 08/08/2026</div></div></div><div class="sph-r"><button type="button" class="btn primary"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5l4 4L8 20H4v-4L16.5 3.5z"/><path d="M14 6l4 4"/></svg>Edit</button></div></div></div><div class="spec"><dl><dt>Use it</dt><dd>On every detail and edit screen, as its header.</dd><dt>Inputs</dt><dd><code>Title</code> (mandatory) and <code>Subtitle</code> (optional): pass the text, the block styles it.</dd><dt>Buttons</dt><dd>Put the action buttons in <code>ButtonPlaceholder</code>, the only placeholder, since they vary by screen (View: Edit; Edit: Exceptions · Delete | Cancel · Add · Update).</dd><dt>← Back</dt><dd>Built into the block. Handle its event with the screen’s existing back client action.</dd><dt>BackLabel</dt><dd>Optional. The back link’s text: blank = “Back”; name the screen it returns to where that helps (“Back to Check History”).</dd><dt>More</dt><dd>See the <a href="detail-template.html">Details/Edit Screen Template</a>.</dd></dl></div></div></section>
  <section class="wd" id="CodeTableDropdown"><div class="wd-h"><h2><code>CodeTableDropdown</code></h2><p>The dropdown for every coded field on an edit form. Loads the code table from the gateway (<code>/v1/codes/{table}</code>).</p></div><div class="wd-b"><div class="demo"><span class="demo-t">Closed</span><div><div class="dd-l">Location</div><div class="dd"><span>CITY HALL</span><span class="ctl"><span aria-hidden="true">×</span><span aria-hidden="true">⌄</span></span></div></div><span class="demo-t">Open: search, description with the code under it</span><div><div class="dd-l">Location</div><div class="dd open"><span>CITY HALL</span><span class="ctl"><span aria-hidden="true">×</span><span aria-hidden="true">⌃</span></span></div><div class="dd-menu"><div class="dd-s">⌕ Search…</div><div class="dd-o on">CITY HALL<small>CHL</small></div><div class="dd-o">CITY SAFETY &amp; WORKERS COMP<small>CSO</small></div><div class="dd-o">COLLABORATIVE RESPONSE DIVISION<small>CRD</small></div></div></div></div><div class="spec"><dl><dt>Inputs</dt><dd><ul><li><code>Table</code> (CodeTables identifier) and <code>Code_Input</code> (Text): mandatory</li><li><code>Qualifier</code>: only for a two-key table (e.g. the benefit plan’s affiliation)</li><li><code>IsRequired</code>, <code>IsValid</code>, <code>IsValidating</code>, <code>ValidationMessage</code>: the red border and message</li><li><code>IsEnabled</code>, <code>DropdownLabel</code>, <code>TabIndex</code>, <code>NextTabIndex</code></li></ul></dd><dt>Event</dt><dd><code>CodeSelected(Code)</code>. Wire it on every use: the handler sets the record’s field (e.g. <code>TaxEntitySelected</code> sets <code>EditForm.taxEntityCode</code>). Focus then moves to <code>NextTabIndex</code>.</dd><dt>Shows</dt><dd>Its own label (<code>DropdownLabel</code>, drawn as <code>ds-label</code>) with a red asterisk when required, then a searchable list sorted by description, the code under each one. Edit only: it has no read-only mode.</dd><dt>Use it</dt><dd><ul><li>In the edit branch of the field’s If on <code>IsEditing</code>. In View use a <code>ds-field</code> with a <code>ds-label</code> and, in its <code>ds-value</code>, a <code>CodeDescriptionConcat</code> of the record’s code and description field (“Code - Description”). See the <a href="detail-template.html">Details/Edit Screen Template</a>.</li><li>A field with no code table (Bureau, Division, Region) is a plain text input.</li><li>Don’t change the block for one screen: it’s used in hundreds of places.</li></ul></dd></dl></div></div></section>
  <section class="wd" id="IncentiveCodeDropdown"><div class="wd-h"><h2><code>IncentiveCodeDropdown</code></h2><p>The same dropdown for the City’s 30 incentive (Additional Pay) codes, from <code>/v1/hr/incentive-codes</code>.</p></div><div class="wd-b"><div class="demo"><div><div class="dd-l">Incentive Code</div><div class="dd"><span>AUTO ALLOWANCE</span><span class="ctl"><span aria-hidden="true">×</span><span aria-hidden="true">⌄</span></span></div></div></div><div class="spec"><dl><dt>Inputs</dt><dd><code>Code_Input</code> (mandatory) plus the same optional inputs as CodeTableDropdown, and <code>IsReadOnly</code>: unlike CodeTableDropdown it kept its read-only mode, which shows the description (one lookup). No <code>Table</code>; <code>Qualifier</code> isn’t used.</dd><dt>Event</dt><dd><code>CodeSelected(IncentiveCode)</code> passes the whole <code>HRIncentiveCode_GetResponse</code> (rate, amount source, payment defaults), not just the code, so the form can fill the amount and defaults.</dd><dt>Shows</dt><dd>The label “Incentive Code” (fixed in the block) and the same searchable list.</dd><dt>Use it</dt><dd>Additional Pay detail, the HR1 Request and the New Hire Request: anywhere HR picks an incentive payment. It’s used in only a few places, so its read-only mode stays.</dd></dl></div></div></section>
  <section class="wd" id="CodeTableText"><div class="wd-h"><h2><code>CodeTableText</code></h2><p>The read-only side of CodeTableDropdown, split out of it: shows the description for a code, looked up live. <strong>Only where OutSystems stores just the code: the HR1 and New Hire requests.</strong></p></div><div class="wd-b"><div class="demo"><div><div class="dd-l">Location</div><div class="txt">CITY HALL</div></div></div><div class="spec"><dl><dt>Inputs</dt><dd><code>Table</code> and <code>Code</code> (mandatory), <code>Qualifier</code>, <code>Label</code>.</dd><dt>Events</dt><dd>None.</dd><dt>Shows</dt><dd>An optional label, then the description. Blank when <code>Code</code> is empty.</dd><dt>Use it</dt><dd><ul><li>HR1 and New Hire store only the codes, so their detail screens look each one up (one call per field, rerun whenever an input changes). HRMS stores codes the same way.</li><li>Not in EmployeeManagement screens: there the GET already returns the description, so show “Code - Description” with <code>CodeDescriptionConcat</code>.</li></ul></dd></dl></div></div></section>
  <section class="wd" id="DateFormat"><div class="wd-h"><h2><code>DateFormat</code></h2><p>Every date shown as text: list columns and detail screens in View.</p></div><div class="wd-b"><div class="demo"><div class="txt">04/21/2023</div><span class="demo-t">Null date</span><div class="txt" style="min-height:20px"></div></div><div class="spec"><dl><dt>Inputs</dt><dd><code>Date</code> (mandatory), <code>ExtendedClass</code>.</dd><dt>Events</dt><dd>None.</dd><dt>Shows</dt><dd>MM/dd/yyyy, never wrapping. Blank for a null date (OutSystems’ null date is 01/01/1900, the gateway’s “no date”).</dd><dt>Use it</dt><dd>For every displayed date, so null dates are blank everywhere: no N/A, no placeholder date.</dd></dl></div></div></section>
  <section class="wd" id="CodeDescriptionConcat"><div class="wd-h"><h2><code>CodeDescriptionConcat</code></h2><p><strong>The standard for every coded value on a detail screen in View: “Code - Description”, as LifeView shows it</strong>, not the description alone.</p></div><div class="wd-b"><div class="demo"><div><div class="dd-l">Tax Entity</div><div class="txt">10000 - CITY OF LONG BEACH</div></div><div><div class="dd-l">Frequency</div><div class="txt">5 - EVERY PERIOD</div></div></div><div class="spec"><dl><dt>Inputs</dt><dd><code>Code</code> and <code>Description</code> (Text).</dd><dt>Events</dt><dd>None.</dd><dt>Shows</dt><dd><code>Code - Description</code>. It only joins the two, like DateFormat only formats a date: simple, but it saves time on the many coded fields. The separator always shows, so an empty value reads “Code - ” or “ - Description”.</dd><dt>Use it</dt><dd><ul><li>In View, as the <code>ds-value</code> of every field that has a code and a description: pass the record’s code and the description the GET returns (e.g. <code>Form.taxEntityCode</code>, <code>Form.taxEntityDescription</code>). It looks nothing up.</li><li>Put it inside the <code>ds-value</code> container (it has no styling of its own).</li><li>In Edit the field is a <code>CodeTableDropdown</code>, as before.</li></ul></dd></dl></div></div></section>
  <section class="wd" id="EffectiveDateFilter"><div class="wd-h"><h2><code>EffectiveDateFilter</code></h2><p>The Effective Date filter row above a payroll list, with its Search and Reset buttons.</p></div><div class="wd-b"><div class="demo"><div class="fbar"><label>Effective Date<span class="date">mm/dd/yyyy</span></label><button type="button" class="sbtn">Search</button><button type="button" class="sbtn out">Reset</button></div></div><div class="spec"><dl><dt>Inputs</dt><dd>None.</dd><dt>Event</dt><dd><code>DateSelected(Date)</code>, its only way to talk to the host. Search sends the date in the box; Reset clears the box and sends an empty date (= every record).</dd><dt>Inside</dt><dd><ul><li>The <code>ButtonSearch</code> and <code>ButtonReset</code> blocks, in a container aligned to the bottom (21px top margin) so they line up with the date input.</li><li>The date is the block’s own local variable, bound to the input. Both buttons call <code>SearchResetOnClick</code>, which stores the date it gets and raises <code>DateSelected</code>.</li><li>Not live: changing the date does nothing until the user clicks Search.</li></ul></dd><dt>Use it</dt><dd>The handler stores the date, sets the list’s StartIndex back to 0 and refreshes it. The date goes to the list’s <code>asOf</code>.</dd><dt>Used in</dt><dd>EmployeeProfile_Accruals, _AdditionalPay, _DirectDeposit, _PayDeduction, _PayrollStatus, _TaxControl, _W2s, Garnishments, GrossToNet (one each).</dd></dl></div></div></section>
  <section class="wd" id="ButtonSearch / ButtonReset"><div class="wd-h"><h2><code>ButtonSearch / ButtonReset</code></h2><p>The two standard filter buttons. Same structure; they differ in label, icon and style.</p></div><div class="wd-b"><div class="demo"><div class="fbar"><button type="button" class="sbtn">Search</button><button type="button" class="sbtn out">Reset</button></div></div><div class="spec"><dl><dt>Search</dt><dd>Label “Search”, magnifying glass icon, primary button.</dd><dt>Reset</dt><dd>Label “Reset”, prohibit icon, standard button.</dd><dt>Inputs</dt><dd><code>IsEnabled</code> (Boolean, mandatory) and <code>ExtendedClass</code> (Text, optional), as the other button blocks.</dd><dt>Event</dt><dd><code>Clicked</code>. No logic of their own: the screen or block that uses them decides what happens.</dd><dt>Used in</dt><dd>Only <code>EffectiveDateFilter</code> so far. Use them for any other filter’s Search and Reset.</dd></dl></div></div></section>
  <section class="wd" id="APIPagination"><div class="wd-h"><h2><code>APIPagination</code></h2><p>Paging, loading, empty and error states for every list read from the gateway. Lists from an OutSystems aggregate use the standard OutSystems pagination.</p></div><div class="wd-b"><div class="demo"><span class="demo-t">Middle page</span><nav class="pager"><button type="button" class="sbtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Previous</button><span class="pg">Page 2</span><button type="button" class="sbtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Next</button></nav><span class="demo-t">Last page</span><nav class="pager"><button type="button" class="sbtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Previous</button><span class="pg">Page 3 of 3</span></nav><span class="demo-t">Loading (IsSearching)</span><div class="loadbox" role="status"><span class="spin" aria-hidden="true"></span>Loading…</div><span class="demo-t">Empty (IsEmpty)</span><div class="nores"><svg class="nores-i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></svg>No results found matching search criteria.</div><span class="demo-t">Error (IsError)</span><div class="nores" role="alert"><svg class="nores-i warn-i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18.2a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>Couldn’t load this list: the server didn’t respond in time. Try again in a moment.</div></div><div class="spec"><dl><dt>Inputs</dt><dd><code>IsSearching</code>, <code>IsEmpty</code>, <code>StartIndex</code>, <code>PageSize</code>, <code>HasMore</code> (mandatory), and <code>IsError</code> + <code>ErrorMessage</code> for a failed call.</dd><dt>Events</dt><dd><code>NextPage</code>, <code>PreviousPage</code>: the parent adds or subtracts PageSize from StartIndex and refreshes.</dd><dt>Shows</dt><dd>A spinner while searching; a large search icon over “No results found matching search criteria.” when there are no rows; a large warning icon over <code>ErrorMessage</code> when <code>IsError</code>, so an empty list and a failed call look different; otherwise Previous (after page 1) · “Page n” (“Page n of n” on the last page) · Next (while HasMore).</dd><dt>Wiring</dt><dd><ul><li>Send StartIndex as <code>skip</code> and PageSize as <code>pageSize</code> on the gateway call. If <code>pageSize</code> isn’t sent the gateway uses the list’s own default (25 or 50), and pages overlap.</li><li><code>HasMore</code> = the response’s <code>hasMore</code>; <code>IsSearching</code> = not yet fetched; <code>IsEmpty</code> = no rows.</li><li><code>IsError</code> = the data action failed (a non-2xx); <code>ErrorMessage</code> = the error body’s <code>detail</code>, the plain sentence for the user.</li><li>StartIndex back to 0 when a filter changes.</li></ul></dd></dl></div></div></section>
  <section class="card" id="rollout"><h2>Rollout: where the blocks still need to go</h2>
    <p class="sub" style="padding:0 20px;margin:0 0 10px">Cleanup next steps, from an AI audit of the ODC app (Studio’s AI mentor, 2026-11-13). <strong>Not yet checked</strong>: counts and screen names are the audit’s; confirm each screen before changing it.</p>
    <div class="tblwrap"><table class="acc std">
    <thead><tr><th scope="col">Block</th><th scope="col">Used today</th><th scope="col">Still to swap in</th><th scope="col">Effort</th></tr></thead><tbody>
<tr><td><code>CodeDescriptionConcat</code></td><td>DirectDeposit_Detail (2), Garnishments (1)</td><td>About 12 hand-built joins: TaxControl_Detail (3), HR1RequestDetail (2), Accrual_Accumulator (2), AdditionalPay_Detail, EmployeeProfile_AdditionalPay, EmployeeProfile_Accruals, GrossToNet_Detail, ApproversTroubleshooting. Leave the join inside CodeTableText. And every coded value in View that still shows the description alone (the new standard).</td><td>Small</td></tr>
<tr><td><code>EffectiveDateFilter</code></td><td>9 lists (see above)</td><td>Check EmployeeProfile_PaycheckHistory and EmployeeProfile_HR1Requests (own Search / Reset, maybe a date filter). Not the Effective Date inputs on edit forms: those are data entry.</td><td>Small, 2 to check</td></tr>
<tr><td><code>DateFormat</code></td><td>About 130, in 40 blocks and screens</td><td>About 30 hand-formatted dates: Landing (4), HR1RequestDetail (4), HR1TransactionPDF (4), LayoutSideMenu (3), OpenEnrollmentConfiguration (2), GatewayLogs (2), HR1RequestsErrorRejectedIcons (2) and singles. Some show a time or another format: swap only the plain MM/dd/yyyy ones.</td><td>Small to medium</td></tr>
<tr><td><code>StickyPageHeader</code></td><td>TaxControl_Detail (pilot)</td><td>Detail blocks with their own back link, title and actions: Paycheck_Detail, Deduction_Detail, AdditionalPay_Detail, DirectDeposit_Detail, GarnishmentDetail, CycleBatch_Detail, TaxAccumulator_Detail, Accrual_Accumulator, AdditionalPay_Accumulator, Deduction_Accumulator, GrossToNet_Detail; HR1RequestEdit. Not HR1RequestDetail (stays as it is). Host screens not yet checked for their own heading row.</td><td>Medium, after the pilot is confirmed</td></tr>
<tr><td><code>Button blocks</code></td><td>ButtonDetails (13 lists), ButtonAccumulator (4), ButtonEdit, ButtonDelete, ButtonCancel / ButtonUpdate / ButtonAdd (TaxControl_Detail; ButtonUpdate to be removed), ButtonSearch / ButtonReset (EffectiveDateFilter); ButtonDownload unused</td><td>About 100 hand-built buttons: “Save” (~35: NewHireRequest_Edit 9, HR1Request_Edit 5, popups and detail blocks), Cancel (~30), Edit (~15), Delete (~10), Add (~8), Search / Reset (3 pairs: HR1Requests, EmployeeProfile_PaycheckHistory, PayrollBatches), Download (~4: W2s, HR1Request_PDFDocuments, import / export popups), Close (~6). Only Cancel, Edit, Delete, Add (list), Search / Reset, Download and Close become blocks; Save, Update and other in-form buttons stay plain buttons. Keep each one’s click action, enabled state and loading.</td><td>Large in total, small each</td></tr>
    </tbody></table></div>
    <div class="spec" style="padding:4px 20px 18px"><dl>
      <dt>Order</dt><dd><ol style="margin:0;padding-left:18px"><li>CodeDescriptionConcat and EffectiveDateFilter (small, low risk).</li><li>DateFormat: check the ~30 hand-formatted dates, swap the ones that match.</li><li>StickyPageHeader, once the pilot is confirmed and the screens are picked.</li><li>Buttons, screen by screen (the largest piece).</li></ol></dd>
      <dt>Differs from this standard</dt><dd><ul>
        <li><strong>“Save” buttons:</strong> the audit suggests a new <code>ButtonSave</code> block. Not needed: a block can’t run the form’s validation, and the <a href="buttons.html">Button standard</a> has no Save. A hand-built Save is relabelled Update (in place) or Add (a new record) and stays a plain button in the form. Decide whether the HR1 and New Hire request forms, which save an OutSystems draft rather than a gateway record, follow that too.</li>
        <li><strong>ButtonUpdate is to be removed.</strong> Inside a form a block button doesn’t run the form’s validation, so Update, Add (form), Previous and Next stay plain buttons in the form, as the Button standard says. TaxControl_Detail’s in-form ButtonUpdate and ButtonAdd go back to plain buttons. <code>ButtonAdd</code> stays: it’s the list screens’ Add.</li>
        <li><strong>A Close block</strong> (popups) is a real gap: none exists yet.</li>
        <li>The audit calls StickyPageHeader’s back event <code>BackClicked</code>.</li></ul></dd>
    </dl></div>
  </section>
</div>

<div id="dc-root"></div>
<script>
(function(){
  var HOLE=/\{\{([^}]*)\}\}/g;
  function get(scope,e){e=(e||'').trim();if(e==='true')return true;if(e==='false')return false;
    return e.split('.').reduce(function(a,k){return a==null?undefined:a[k];},scope);}
  function one(s){var m=(s||'').match(/^\s*\{\{([^}]*)\}\}\s*$/);return m?m[1]:null;}
  function interp(s,scope){return s.replace(HOLE,function(m,e){var v=get(scope,e);return v==null||v===false?'':String(v);});}
  function build(nodes,scope,out){
    for(var i=0;i<nodes.length;i++){var n=nodes[i];
      if(n.nodeType===3){out.appendChild(document.createTextNode(interp(n.data,scope)));continue;}
      if(n.nodeType!==1)continue;
      if(n.tagName==='TEMPLATE'&&n.hasAttribute('data-sc-if')){if(get(scope,one(n.getAttribute('value'))))build(n.content.childNodes,scope,out);continue;}
      if(n.tagName==='TEMPLATE'&&n.hasAttribute('data-sc-for')){
        var list=get(scope,one(n.getAttribute('list')))||[],as=n.getAttribute('as');
        list.forEach(function(item){var sc=Object.create(scope);sc[as]=item;build(n.content.childNodes,sc,out);});continue;}
      var el=n.cloneNode(false),post=[];
      Array.prototype.slice.call(el.attributes).forEach(function(a){
        var nm=a.name,v=a.value;
        if(nm.indexOf('hint-placeholder')===0){el.removeAttribute(nm);return;}
        if(v.indexOf('{{')<0)return;
        if(nm.slice(0,2)==='on'){el.removeAttribute(nm);var fn=get(scope,one(v));if(typeof fn==='function')el.addEventListener(nm.slice(2),fn);return;}
        if(nm==='defaultvalue'){el.removeAttribute(nm);var dv=get(scope,one(v));post.push(function(){el.value=dv==null?'':dv;});return;}
        if(nm==='defaultchecked'){el.removeAttribute(nm);el.checked=!!get(scope,one(v));return;}
        el.setAttribute(nm,interp(v,scope));
      });
      build(n.childNodes,scope,el);post.forEach(function(f){f();});out.appendChild(el);
    }
  }
  var tpl=document.getElementById('dc-template'),root=document.getElementById('dc-root'),comp;
  window.DCLogic=function(props){this.props=props||{};this.state={};};
  window.DCLogic.prototype.setState=function(o){Object.assign(this.state,o);render();};
  window.DCLogic.prototype.renderVals=function(){return {};};
  function render(){var y=window.scrollY;root.replaceChildren();build(tpl.content.childNodes,comp.renderVals(),root);window.scrollTo(0,y);}
  window.__dcMount=function(C){var q={};new URLSearchParams(location.search).forEach(function(v,k){q[k]=v;});comp=new C({query:q});render();};
})();
</script>
<script>
class Component extends DCLogic {
  renderVals() { return {}; }
}

__dcMount(Component);
</script>
