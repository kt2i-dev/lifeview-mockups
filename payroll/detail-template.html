<title>Details/Edit Screen Template</title>
<!-- LifeView Gateway payroll detail mockup. Standalone export of the claude.ai design canvas:
     open in any browser. The yellow "Mockup controls" strip only switches states; it is not part of the design. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f3f5f8;font-family:Inter,system-ui,sans-serif;color:#1c2431}
a{color:#0a5bd3}a:hover{color:#0848a8}
.page{max-width:1240px;margin:0 auto;padding:16px 24px 48px;box-sizing:border-box}
.mock{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding:10px 14px;border:1px dashed #9aa4b2;border-radius:8px;background:#fffbe8;font-size:12px;color:#4a5361;margin-bottom:20px}
.mock-t{font-weight:600;color:#2b3340;letter-spacing:.05em;text-transform:uppercase;font-size:11px}
.mock-g{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid #c5ccd6;border-radius:6px;overflow:hidden}
.seg button{border:0;border-right:1px solid #c5ccd6;background:#fff;padding:0 12px;font:inherit;cursor:pointer;color:#2b3340;min-height:32px}
.seg button:last-child{border-right:0}
.seg button.on{background:#1c2431;color:#fff}
.seg button:disabled{color:#8a93a1;cursor:not-allowed;text-decoration:line-through}
.back{font-size:13px;text-decoration:none}
.titlebar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin:8px 0 20px}
h1{margin:0;font-size:24px;font-weight:600}
.sub{margin-top:4px;font-size:14px;color:#5b6575}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef1f5;color:#3a4350;font-size:12px;font-weight:600;margin-left:8px;vertical-align:middle}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:40px;padding:0 18px;border-radius:6px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;border:1px solid #0a5bd3;background:#fff;color:#0a5bd3;text-decoration:none;display:inline-flex;align-items:center;box-sizing:border-box}
.btn.primary{background:#0a5bd3;color:#fff}
.btn.danger{border-color:#b42318;color:#b42318}
.btn.danger-solid{background:#b42318;border-color:#b42318;color:#fff}
.btn.ghost{border-color:#b9c1cc;color:#2b3340}
.sep{width:1px;height:28px;background:#d3d9e1;margin:0 4px;align-self:center}
.card{background:#fff;border:1px solid #dde2e9;border-radius:10px;margin-bottom:16px}
.card h2{margin:0;padding:14px 20px;font-size:15px;font-weight:600;border-bottom:1px solid #e8ecf1}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 28px;padding:18px 20px 22px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.grid,.grid.c2,.grid.c4{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:12px;color:#5b6575;font-weight:500}
.req{color:#b42318;margin-left:3px}
.val{font-size:14px;min-height:20px;overflow-wrap:anywhere}
.val.muted{color:#5b6575;min-height:38px;display:flex;align-items:center}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.in{height:38px;border:1px solid #b9c1cc;border-radius:6px;padding:0 10px;font:inherit;font-size:14px;color:#1c2431;background:#fff;box-sizing:border-box;width:100%}
.in:focus{outline:2px solid #0a5bd3;outline-offset:-1px}
.help{font-size:12px;color:#5b6575}
.src{align-self:flex-start;font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#6b4500;background:#fffbe8;border:1px dashed #d9b75e;border-radius:4px;padding:1px 6px}
.radios{display:flex;flex-wrap:wrap;gap:6px 18px;min-height:38px;align-items:center}
.radio{display:flex;gap:6px;align-items:center;font-size:14px}
.banner{padding:12px 16px;border-radius:8px;background:#e7f4ec;border:1px solid #9fd3b4;color:#14532d;font-size:14px;margin-bottom:16px}
.editing{padding:10px 16px;border-radius:8px;background:#eaf1fd;border:1px solid #b6cdf5;color:#173f84;font-size:14px;margin-bottom:16px}
.warn{padding:10px 16px;border-radius:8px;background:#fff6e5;border:1px solid #f1cf8f;color:#6b4500;font-size:14px;margin-bottom:16px}
.err{padding:12px 16px;border-radius:8px;background:#fdecea;border:1px solid #f1aeb5;color:#7a1a12;font-size:14px;margin-bottom:16px}
.err .host{display:block;margin-top:4px;font-size:12px;color:#8c2f26}
.dialog .host{display:block;margin-top:6px;font-size:12px;color:#5b6575}
.titlebar.sticky{position:sticky;top:0;z-index:5;background:#f3f5f8;padding:12px 0;margin-top:0;border-bottom:1px solid #dde2e9}
.exc{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#3a4350;margin-right:4px}
.exc .opts{display:inline-flex;border:1px solid #b9c1cc;border-radius:6px;overflow:hidden}
.exc .opts button{border:0;border-right:1px solid #b9c1cc;background:#fff;font:inherit;font-size:12px;padding:0 10px;min-height:32px;cursor:pointer;color:#2b3340}
.exc .opts button:last-child{border-right:0}
.exc .opts button.on{background:#0a5bd3;color:#fff}
.btn:not(.primary) .spin{border-color:rgba(10,91,211,.25);border-top-color:#0a5bd3}
.err .err-btn{margin-top:10px;min-height:32px;padding:0 12px;font-size:13px;border-color:#7a1a12;color:#7a1a12;background:#fff}
.loadbox{display:flex;gap:10px;align-items:center;justify-content:center;padding:36px 16px;color:#5b6575;font-size:14px}
.loadbox .spin{border-color:rgba(10,91,211,.25);border-top-color:#0a5bd3}
td.empty{text-align:center;color:#5b6575;padding:18px 10px}
.nores{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px 36px;font-size:13px;color:#2b3340}
.nores-i{width:72px;height:72px;color:#9aa4b2}
.nores-i.warn-i{color:#c77700}
.notes{background:#f8fafc;border:1px dashed #b9c1cc;border-radius:10px;padding:14px 20px 16px;font-size:13px;color:#3a4350;line-height:1.55;margin-top:28px}
.notes h3{margin:0 0 6px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#5b6575}
.notes ul{margin:0;padding-left:18px}
.overlay{position:fixed;inset:0;background:rgba(20,26,36,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dialog{background:#fff;border-radius:10px;max-width:460px;width:100%;padding:22px 24px;box-sizing:border-box}
.dialog h2{margin:0 0 8px;font-size:18px}
.dialog p{margin:0 0 18px;font-size:14px;color:#3a4350;line-height:1.5}
.tblwrap{overflow-x:auto;padding:4px 20px 20px}
table.acc{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
table.acc th{background:#0a5bd3;color:#fff;text-align:left;font-weight:600;font-size:12px;padding:10px 12px}
table.acc th.num{text-align:right}
table.acc td{padding:10px 12px;border-bottom:1px solid #e8ecf1}
table.acc td.num{text-align:right;font-variant-numeric:tabular-nums}
table.acc td.na{text-align:right;color:#8a93a1}
table.acc tr.group td{background:#f3f6fa;font-size:12px;font-weight:600;color:#3a4350;letter-spacing:.03em;text-transform:uppercase;padding:8px 12px}
table.acc tr.total td{font-weight:600}

.page{max-width:1440px}
.ptitle{margin:6px 0 16px;font-size:22px;font-weight:700}
.shell{background:#fff;border-radius:10px;padding:24px 26px 32px}
.emp{border:1px solid #dde2e9;border-left:4px solid #0a5bd3;border-radius:8px;padding:12px 20px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.emp .nm{font-size:18px;font-weight:700}
.emp .k{font-size:12px;color:#8a93a1}.emp .v{font-size:13px;font-weight:600;margin-left:4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:16px 0 18px}
.tile{border:1px solid #dde2e9;border-radius:6px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:14px;color:#2b3340;background:#fff}
.tile .ic{color:#0a5bd3;font-size:16px}
.tile.on{background:#e3edfb;border-color:#0a5bd3;color:#0a5bd3}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid #d3d9e1;margin-bottom:22px}
.tabs button{border:0;background:none;font:inherit;font-size:13px;color:#2b3340;padding:10px 13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{border-bottom-color:#1c2431;font-weight:600}
.lhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.lhead h2{margin:0;font-size:16px;font-weight:700}
.sbtn{min-height:32px;padding:0 14px;border-radius:4px;font:inherit;font-size:12px;cursor:pointer;border:1px solid #0a5bd3;background:#0a5bd3;color:#fff;text-decoration:none;display:inline-flex;align-items:center;box-sizing:border-box}
.sbtn.out{background:#fff;color:#0a5bd3}
.filters{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#3a4350}
.filters input{height:32px;width:320px;max-width:100%;border:1px solid #c5ccd6;border-radius:4px;padding:0 10px;font:inherit;font-size:13px;box-sizing:border-box}
table.list{border-collapse:collapse;width:100%;font-size:12px}
table.list th{background:#0a5bd3;color:#fff;text-align:left;font-weight:600;padding:12px 10px}
table.list td{padding:7px 10px;border-bottom:1px solid #e3e8ef;height:30px}
table.list tbody tr:nth-child(even) td{background:#eaf1fb}
.lact{display:flex;gap:12px}
.lact .sbtn{background:#fff;color:#0a5bd3}
.muted{color:#8a93a1}
.ltbl{overflow-x:auto}
.sum{border:1px solid #dde2e9;border-radius:8px;margin-bottom:14px}
.sum .hd{padding:14px 18px;font-size:13px;border-bottom:1px solid #e3e8ef;display:flex;justify-content:space-between}
.sum .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 24px;padding:16px 32px 20px}
.sum .g4 .lbl{font-size:12px;color:#5b6575}.sum .g4 .val{font-size:12px;font-weight:500;margin-top:3px}
@media (max-width:760px){.tiles,.sum .g4{grid-template-columns:minmax(0,1fr)}}

.crumb{border:0;background:none;padding:0;font:inherit;font-size:13px;color:#0a5bd3;cursor:pointer;margin:0 0 10px}
.crumb:hover{color:#0848a8;text-decoration:underline}
.lhead .sub{margin-top:4px;font-size:13px;color:#5b6575}
.filters select{height:32px;width:320px;max-width:100%;border:1px solid #c5ccd6;border-radius:4px;padding:0 10px;font:inherit;font-size:13px;background:#fff}
.accd{border:1px solid #dde2e9;border-radius:6px}
.accd-h{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-size:13px;border-top:1px solid #dde2e9}
.accd-h:first-child{border-top:0}
.chev{width:9px;height:9px;border-right:1.5px solid #2b3340;border-bottom:1.5px solid #2b3340;transform:rotate(45deg);margin-right:6px}
.chev.up{transform:rotate(-135deg)}
.accd-b{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 24px;padding:6px 32px 20px}
.accd-b .lbl{font-size:12px;color:#5b6575}.accd-b .val{font-size:12px;margin-top:3px}
@media (max-width:760px){.accd-b{grid-template-columns:minmax(0,1fr)}}
.pager{display:flex;justify-content:center;align-items:center;gap:16px;margin:16px 0 4px}
.pager .sbtn{background:#fff;color:#0a5bd3}
.pager .sbtn:disabled{border-color:#c5ccd6;color:#8a93a1;cursor:not-allowed}
.pager .pg{font-size:13px;color:#2b3340;min-width:96px;text-align:center}

.tpl{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:1000px){.tpl{grid-template-columns:minmax(0,1fr)}}
.stage{background:#e9edf2;border-radius:10px;padding:18px}
.sample{margin:0 auto;background:#f6f7f9;border-radius:8px;padding:16px;box-sizing:border-box}
.sample.w1{max-width:390px}.sample.w2{max-width:700px}
.ds-header .back{display:inline-block;font-size:13px;text-decoration:none;margin-bottom:4px}
.eg-title{font-size:20px;font-weight:700;margin:0 0 4px}.eg-sub{font-size:13px;color:#5b6575}
.ds-card{background:#fff;border:1px solid #dde2e9;border-radius:8px;padding:14px 18px 18px;margin-bottom:16px}
.ds-card-title{display:block;font-size:15px;font-weight:700;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid #e3e8ef}
.ds-grid{display:grid;grid-template-columns:minmax(0,1fr);column-gap:24px;row-gap:16px}
.ds-grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.ds-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ds-field{min-width:0}
.ds-label{display:block;font-size:12px;font-weight:600;color:#5b6575;margin-bottom:6px}
.ds-value{font-size:14px;padding-left:4px;min-height:20px;overflow-wrap:anywhere}
.ds-in{height:38px;width:100%;box-sizing:border-box;border:1px solid #c5ccd6;border-radius:6px;padding:0 10px;font:inherit;font-size:14px;background:#fff}
.ds-dd{display:flex;align-items:center;justify-content:space-between;height:38px;border:1px solid #c5ccd6;border-radius:6px;padding:0 10px;font-size:14px;background:#fff;box-sizing:border-box}
.ds-dd .ph{color:#8a93a1}.ds-dd .ctl{color:#5b6575;font-size:12px}
.ds-radios{display:flex;gap:16px;min-height:38px;align-items:center;font-size:14px}.ds-radios label{display:flex;gap:6px;align-items:center}
.ds-help{font-size:12px;color:#5b6575;margin-top:4px}
.ds-alert{padding:12px 16px;border-radius:8px;background:#fdecea;border:1px solid #f1aeb5;color:#7a1a12;font-size:14px;margin-bottom:16px}
.ds-alert small{display:block;margin-top:4px;font-size:12px;color:#8c2f26}
.ds-header{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;background:#f6f7f9;padding:10px 0 12px;margin-bottom:14px;border-bottom:1px solid #dde2e9}
.ds-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px}
.ds-actions .sep{width:1px;height:28px;background:#d3d9e1}
.ds-exc{display:inline-flex;border:1px solid #b9c1cc;border-radius:6px;overflow:hidden}
.ds-exc button{border:0;border-right:1px solid #b9c1cc;background:#fff;font:inherit;font-size:12px;padding:0 10px;min-height:32px;cursor:pointer;color:#2b3340}
.ds-exc button:last-child{border-right:0}.ds-exc button.on{background:#0a5bd3;color:#fff}
.ds-alert .btn{margin-top:10px;min-height:32px;padding:0 12px;font-size:13px;border-color:#7a1a12;color:#7a1a12;background:#fff}
.btn.btn-delete{border-color:#b42318;color:#b42318}
/* inspector */
.insp [data-k]{cursor:pointer}
.insp [data-k]:hover:not(:has([data-k]:hover)){outline:2px solid #0a5bd3;outline-offset:2px}
.insp .picked{outline:2px solid #e8590c !important;outline-offset:2px}
.outl [data-tag]{position:relative;outline:1px dashed #9aa4b2;outline-offset:1px}
.outl [data-tag]::before{content:attr(data-tag);position:absolute;top:-9px;right:4px;font:600 10px/1.4 ui-monospace,Menlo,monospace;color:#6b4500;background:#fffbe8;border:1px solid #e6cf8f;border-radius:3px;padding:0 4px;z-index:2;pointer-events:none;white-space:nowrap}
.panel{position:sticky;top:12px;background:#fff;border:1px solid #dde2e9;border-radius:10px;padding:16px 18px;font-size:13px;line-height:1.5;max-height:calc(100vh - 24px);overflow:auto}
.panel .p-kind{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#e8590c}
.panel h3{margin:2px 0 10px;font-size:16px}
.panel table{border-collapse:collapse;width:100%;margin-bottom:10px}
.panel th{text-align:left;font-weight:600;color:#5b6575;font-size:12px;padding:5px 8px 5px 0;vertical-align:top;width:38%}
.panel td{font:12px/1.45 ui-monospace,Menlo,monospace;padding:5px 0;border-top:1px solid #eef1f5;overflow-wrap:anywhere}
.panel th{border-top:1px solid #eef1f5}
.panel .p-h{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#5b6575;margin:6px 0 4px}
.panel ul{margin:0;padding-left:18px}.panel li{margin-bottom:4px}
.panel li.tree{list-style:none;margin:0 0 0 -18px;font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre}
.panel .hint{color:#5b6575}
.ref h2{font-size:15px}
.ref .body{padding:14px 20px 18px;font-size:13.5px;line-height:1.55;color:#2b3340}
.ref pre{background:#f6f7f9;border:1px solid #e3e8ef;border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.5;overflow-x:auto;margin:6px 0 12px}
.ref table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0 10px}
.ref th{text-align:left;background:#f3f6fa;font-weight:600;padding:8px 10px;border-bottom:1px solid #dde2e9}
.ref td{padding:8px 10px;border-bottom:1px solid #eef1f5;vertical-align:top}
.ref code{font-size:12px;background:#f3f5f8;border-radius:4px;padding:1px 4px}
.ref ul{margin:4px 0 10px;padding-left:20px}
.ref h3{font-size:13px;margin:14px 0 4px}
.dd2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px}@media (max-width:760px){.dd2{grid-template-columns:minmax(0,1fr)}}
/*icons*/.btn,.sbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;box-sizing:border-box;white-space:nowrap}.lact{flex-wrap:nowrap}.i{width:16px;height:16px;flex:none}.sbtn .i{width:14px;height:14px}.btn.small .i{width:14px;height:14px}.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}</style>

<body>
<style>.mock-home{display:flex;justify-content:flex-end;max-width:1440px;margin:0 auto;padding:10px 24px 0;box-sizing:border-box;font:12px Inter,system-ui,sans-serif}.mock-home a{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px dashed #9aa4b2;border-radius:6px;background:#fffbe8;color:#2b3340;text-decoration:none;font-weight:600}.mock-home a:hover{border-color:#0a5bd3;color:#0a5bd3}</style><nav class="mock-home" aria-label="Mockup navigation"><a href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Mockups home</a></nav>
<template id="dc-template">
<div class="page">
  <div class="mock" aria-label="Mockup controls">
    <span class="mock-t">Mockup controls — not part of the design</span>
    <div class="mock-g">Mode
      <div class="seg">
        <button type="button" class="{{sgView}}" onClick="{{toView}}">View</button>
        <button type="button" class="{{sgEdit}}" onClick="{{toEdit}}">Edit</button>
        <button type="button" class="{{sgAdd}}" onClick="{{toAdd}}">Add</button>
      </div>
    </div>
    <div class="mock-g">Width
      <div class="seg">
        <button type="button" class="{{sgW1}}" onClick="{{toW1}}">Phone · 1 col</button>
        <button type="button" class="{{sgW2}}" onClick="{{toW2}}">Small · 2</button>
        <button type="button" class="{{sgW3}}" onClick="{{toW3}}">Medium · 3</button>
      </div>
    </div>
    <div class="mock-g">Error alert
      <div class="seg">
        <button type="button" class="{{sgAlOff}}" onClick="{{alOff}}">Off</button>
        <button type="button" class="{{sgAlOn}}" onClick="{{alOn}}">Error</button>
        <button type="button" class="{{sgAl122}}" onClick="{{al122}}">TS0122</button>
      </div>
    </div>
    <div class="mock-g">Outlines
      <div class="seg">
        <button type="button" class="{{sgOlOff}}" onClick="{{olOff}}">Off</button>
        <button type="button" class="{{sgOlOn}}" onClick="{{olOn}}">Show every class</button>
      </div>
    </div>

  <div class="titlebar"><div><h1>Details/Edit Screen Template</h1>

  <section class="card ref"><h2>How a detail screen behaves</h2><div class="body">
    <table><thead><tr><th scope="col">Step</th><th scope="col">When</th><th scope="col">What the screen does</th></tr></thead><tbody>
      <tr><td>Open</td><td>The screen receives the record’s Id</td><td>Fetch it with a data action (Fetch at start), never in the initialization action, with a loading state while it runs, and only while the block is on screen: inside the Employee Profile, only the open tab and view fetch. Opens read-only.</td></tr>
      <tr><td>Open to add</td><td>The key is empty (<code>IsNew</code>, or an empty <code>ColToken</code> / <code>BatchId</code>)</td><td>Opens already in edit mode. Don’t call the detail GET (an empty key reaches the list route); load dropdowns from the endpoint’s <code>/options</code> or <code>/v1/codes</code>. Effective Date left blank = the gateway uses the current pay period begin.</td></tr>
      <tr><td>Edit</td><td><code>CanEdit</code> and the endpoint has a PUT</td><td>Sets <code>IsEditing</code>: only the editable fields become inputs, in place. Read-only fields (and keys) stay plain text in the same position.</td></tr>
      <tr><td>Exceptions</td><td>Editing or adding, where the endpoint takes <code>overrideExceptions</code></td><td>Return Exceptions (default) or Override Exceptions, as LifeView’s Submit Options. Resets to Return when the form opens and after each save. Override adds <code>?overrideExceptions=true</code> to the write.</td></tr>
      <tr><td>Update</td><td>Editing an existing record</td><td>PUT: changes this record in place. Validates the form, sends every shown field (blanks too) and <code>colToken</code> unchanged; disabled with a busy state while it runs. Success: back to the list or tab.</td></tr>
      <tr><td>Add</td><td>Adding, or editing where LifeView has both Add and Update</td><td>POST: the form as a new row; the record opened stays as history, so it usually goes with a new Effective Date. Same validation, busy state and return as Update.</td></tr>
      <tr><td>Save fails</td><td>Any non-2xx</td><td>One error alert above the first card: <code>detail</code>, then <code>hostCode – hostMessage</code> smaller (left out when <code>hostCode</code> is null). Stays in edit mode, and the page scrolls to the alert.</td></tr>
      <tr><td>&nbsp;&nbsp;409</td><td>Someone changed the record</td><td>Say so and reload it. Don’t retry silently.</td></tr>
      <tr><td>&nbsp;&nbsp;422 TS0122</td><td>An exception that can be overridden, sent with Return Exceptions</td><td>The alert carries an “Update with Override Exceptions” (or “Add …”) button: one click re-sends the same save with <code>overrideExceptions=true</code>. No dialog.</td></tr>
      <tr><td>&nbsp;&nbsp;403</td><td>Writes are off on this gateway</td><td>Show the error: nothing was saved.</td></tr>
      <tr><td>Cancel</td><td>Editing</td><td>Existing record: leave edit mode and reset the values, stay on the screen. New record: back to the list.</td></tr>
      <tr><td>Delete</td><td>Editing an existing record, the endpoint has a DELETE</td><td>Confirm, naming the record (“Delete deduction 068 effective 08/08/2026?”), then back to the list.</td></tr>
      <tr><td>← Back</td><td>Any time (the breadcrumb above the title)</td><td>Back to the list or tab the user came from.</td></tr>
    </tbody></table>
    <p>Three screen patterns, set by what the endpoint allows: <strong>Editable</strong> (has a PUT: Edit), <strong>Add-only</strong> (POST but no PUT, a change is a new dated row: the action that adds it), <strong>Read-only</strong> (GET only: no actions). All three have the ← Back breadcrumb.</p>
  </div></section>

  <section class="card ref"><h2>1. Page structure</h2><div class="body">
<pre>Screen or block root          class: ds-root
└─ Form                       (form screens)
   ├─ Header row              sticky: title left, actions right
   │  ├─ ← Back breadcrumb, title + subtitle
   │  └─ Actions              class: ds-actions
   ├─ Error alert             (above the first card)
   └─ Section card            class: ds-card          (one per section)
      ├─ Section title        class: ds-card-title    (first child)
      └─ Field grid           Container, Layout = Grid
         ├─ Field             class: ds-field
         └─ …</pre>
    <ul><li>Every section is its own <code>ds-card</code> with a <code>ds-card-title</code> as its first child.</li>
      <li>Fields never sit directly in the card: they go in the grid container.</li></ul>
  </div></section>

  <section class="card ref"><h2>2. The grid container</h2><div class="body">
    <p>Set these on the Container (Layout = Grid), not in CSS:</p>
    <table><thead><tr><th scope="col">Property</th><th scope="col">Value</th></tr></thead><tbody>
      <tr><td>Layout mode</td><td>Grid</td></tr><tr><td>Columns</td><td>1 (base)</td></tr>
      <tr><td>Column gap</td><td>M (<code>--space-m</code>, 24px)</td></tr><tr><td>Row gap</td><td>Base (<code>--space-base</code>, 16px)</td></tr>
      <tr><td>Columns override, Small breakpoint</td><td>2</td></tr><tr><td>Columns override, Medium breakpoint</td><td>3</td></tr>
    </tbody></table>
    <ul><li>No style class on the grid container itself.</li>
      <li>Spacing comes from the gaps only; no <code>display:grid</code> or <code>display:flex</code> in custom CSS.</li>
      <li>A field that needs the full row (a long note) takes a column span on its own <code>ds-field</code>.</li></ul>
  </div></section>

  <section class="card ref"><h2>3. Field patterns</h2><div class="body"><div class="dd2">
    <div><h3>Read-only field</h3>
<pre>ds-field
├─ Container  ds-label → Text (label)
└─ Container  ds-value → Expression</pre></div>
    <div><h3>Editable field</h3>
<pre>ds-field
├─ Label widget  ds-label  (the input's label)
└─ If IsEditing
   ├─ True:  input / dropdown / date picker / radio
   └─ False: Expression  ds-value</pre></div>
    <div><h3>Code-table field</h3>
<pre>If IsEditing
├─ True:  CodeTableDropdown (draws its own ds-label)
└─ False: ds-field
          ├─ Container  ds-label → label text
          └─ Container  ds-value → Form.&lt;x&gt;Description</pre></div>
    <div><h3>Values</h3><ul>
      <li>Code-table values in read-only: the response’s description field (e.g. <code>Form.taxEntityDescription</code>). No <code>CodeTableText</code> in EmployeeManagement screens.</li>
      <li>No description field: build the text from the code (Checking/Savings from “C” or “S”).</li>
      <li>Dates: the <code>DateExpression</code> block (MM/dd/yyyy; blank for a null date).</li>
      <li>Decimals: <code>FormatDecimal(value, 2, ".", ",")</code> in the <code>ds-value</code> expression.</li>
      <li>Required markers: the input’s Mandatory (CodeTableDropdown: <code>IsRequired</code>), only while editing. Never type an asterisk.</li></ul></div>
  </div></div></section>

  <section class="card ref"><h2>4. Class reference</h2><div class="body">
    <table><thead><tr><th scope="col">Class</th><th scope="col">Where</th><th scope="col">What it does</th></tr></thead><tbody>
      <tr><td><code>ds-root</code></td><td>Outermost container of a block or screen body</td><td>Full width</td></tr>
      <tr><td><code>ds-card</code></td><td>One per section</td><td>White box, border, rounded corners, inner padding, space below</td></tr>
      <tr><td><code>ds-card-title</code></td><td>First child of a card</td><td>Bold heading with a bottom rule; block display</td></tr>
      <tr><td><code>ds-field</code></td><td>One per field, directly inside the grid</td><td>Prevents overflow in grid cells</td></tr>
      <tr><td><code>ds-label</code></td><td>Label container or Label widget</td><td>Small bold gray text, block display (don’t also add <code>display-block</code>)</td></tr>
      <tr><td><code>ds-value</code></td><td>The value container or expression</td><td>Normal text, indented one small step, minimum height so empty values keep their row</td></tr>
      <tr><td><code>ds-actions</code></td><td>The actions container, right side of the sticky header row</td><td>Right-aligned row, gap between buttons</td></tr>
      <tr><td>sticky header class</td><td>The header row</td><td>Keeps the title and actions pinned while the form scrolls (how to build it in OutSystems: to come)</td></tr>
      <tr><td><code>validation-message</code></td><td>Under an invalid input</td><td>Error text, from the base OutSystems UI theme</td></tr>
      <tr><td><code>btn</code>, <code>btn-primary</code>, <code>btn-delete</code></td><td>Buttons</td><td><code>btn-delete</code> is a red outline. Prefer the button blocks where they fit.</td></tr>
    </tbody></table>
  </div></section>

  <section class="card ref"><h2>5. Header row and actions</h2><div class="body">
<pre>Header row (sticky)
├─ ← Back breadcrumb, then title + subtitle
└─ ds-actions
   Viewing:  Edit            (← Back breadcrumb above the title)
   Editing:  [Return | Override Exceptions] · Delete | Cancel · Add · Update
   Adding:   [Return | Override Exceptions] · Cancel · Add</pre>
    <ul><li>Same place in every mode, pinned at the top while the form scrolls, so the buttons are always visible.</li>
      <li>Delete stands apart from the save buttons (a divider), so it isn’t clicked by mistake.</li>
      <li><strong>Add and Update</strong>: where LifeView shows both while editing (55 screens, including every Editable payroll screen and CalPERS IDs), so do we. Update = PUT in place; Add = POST a new row. Update-only screens (Payroll Status, Check Distribution, Time Sheet Control) show Update alone.</li>
      <li><strong>Return | Override Exceptions</strong> on every screen whose endpoint takes <code>overrideExceptions</code> (LifeView’s Submit Options); Return by default, reset each time.</li>
      <li>Add and Update run the form’s validation, so they’re normal buttons; ← Back is a link above the title. Edit, Delete and Cancel are the <code>ButtonEdit</code> / <code>ButtonDelete</code> / <code>ButtonCancel</code> blocks. See the <a href="buttons.html">Button standard</a>.</li>
      <li>Popups keep their buttons at the bottom, as dialogs do.</li></ul>
  </div></section>

  <section class="card ref"><h2>6. Do and don’t</h2><div class="body"><div class="dd2">
    <div><h3>Do</h3><ul><li>Use the grid container for every field area.</li><li>Label above value, the value indented by <code>ds-value</code>.</li><li>One <code>ds-card</code> per section, each with a <code>ds-card-title</code>.</li></ul></div>
    <div><h3>Don’t</h3><ul><li>Use the Columns blocks for new field layouts.</li><li>Use <code>ds-row</code>, <code>ds-stack-rows</code> or <code>display-block</code> on labels (they did nothing or are redundant).</li>
      <li>Add margins to <code>ds-field</code>: the grid gap already spaces it, so a margin doubles it.</li><li>Put inline colors, sizes, flex or grid CSS on widgets.</li>
      <li>Type a hex color or a pixel size: use the theme’s colors and spacing steps (next section).</li></ul></div>
  </div></div></section>

  <section class="card ref"><h2>7. Colors, spacing and type: use the theme</h2><div class="body">
    <p>Never type a hex code or a pixel value. Use OutSystems UI’s theme: a utility class on the widget first, and in a theme class the CSS variable (<code>var(--color-error)</code>, <code>var(--space-base)</code>). Then a theme change reaches every screen.</p>
    <table><thead><tr><th scope="col">What</th><th scope="col">Use</th></tr></thead><tbody>
      <tr><td>Brand colors</td><td><code>primary</code>, <code>secondary</code>: classes <code>text-primary</code>, <code>background-primary</code>; variables <code>--color-primary</code>, <code>--color-secondary</code></td></tr>
      <tr><td>Status colors</td><td><code>info</code>, <code>success</code>, <code>warning</code>, <code>error</code>, each with a <code>-light</code> variant: <code>text-error</code>, <code>background-error-light</code>, <code>--color-warning</code>… (there is no “alert” color: use <code>warning</code>)</td></tr>
      <tr><td>Grays</td><td><code>neutral-0</code> (white) to <code>neutral-10</code> (darkest): <code>text-neutral-7</code>, <code>background-neutral-1</code>, <code>--color-neutral-4</code></td></tr>
      <tr><td>Spacing</td><td>Steps <code>none</code> 0, <code>xs</code> 4px, <code>s</code> 8px, <code>base</code> 16px, <code>m</code> 24px, <code>l</code> 32px, <code>xl</code> 40px, <code>xxl</code> 48px. Classes <code>margin-base</code>, <code>padding-m</code>, and per side <code>margin-top-s</code>, <code>padding-x-base</code> (top / right / bottom / left / x / y). Variables <code>--space-base</code>…</td></tr>
      <tr><td>Type</td><td>Sizes <code>heading1</code>–<code>heading6</code>, <code>font-size-base</code>, <code>font-size-s</code>, <code>font-size-xs</code>; weights <code>font-light</code>, <code>font-regular</code>, <code>font-semi-bold</code>, <code>font-bold</code></td></tr>
      <tr><td>Borders and shadows</td><td><code>border-radius-none</code> / <code>-soft</code> / <code>-rounded</code> / <code>-circle</code>; <code>border-size-none</code> / <code>-s</code> (1px) / <code>-m</code> (2px) / <code>-l</code> (3px); <code>shadow-none</code>, <code>shadow-xs</code> … <code>shadow-xl</code></td></tr>
    </tbody></table>
    <p>Names from the OutSystems UI style guide. It doesn’t print the pixel values; the spacing values above are its 8px scale (with 4px as the smallest step). Check them in the app’s theme (<code>:root</code> in the browser’s dev tools) if one matters.</p>
  </div></section>

  <section class="card ref"><h2>8. Not on the standard yet, and the reference screens</h2><div class="body">
    <p><code>DirectDeposit_Detail</code>, <code>GarnishmentDetail</code> and <code>Deduction_Detail</code> still use the older Columns blocks (2 or 3 columns), spaced by a stopgap: each Columns row has the <code>ds-form-row</code> extended class, and the theme pads the cells in a card (not the last row). When a screen is rebuilt, replace the Columns rows with the grid container and remove <code>ds-form-row</code>. Widgets can’t be moved between containers, so converting means rebuilding the section.</p>
    <p>Reference implementations: <code>GrossToNet_Detail</code> and <code>Accrual_Accumulator</code> (read-only): a <code>ds-root</code> wrapper and <code>ds-card</code> sections, each grid 1 / 2 / 3 columns at base / Small / Medium, column gap M and row gap Base. Only the read-only grid exists in the app so far; the editable pattern is the one <code>DirectDeposit_Detail</code> uses, moved into a <code>ds-field</code> inside the grid.</p>
  </div></section>

<div id="dc-root"></div>
<script>
(function(){
  var HOLE=/\{\{([^}]*)\}\}/g;
  function get(scope,e){e=(e||'').trim();if(e==='true')return true;if(e==='false')return false;
    return e.split('.').reduce(function(a,k){return a==null?undefined:a[k];},scope);}
  function one(s){var m=(s||'').match(/^\s*\{\{([^}]*)\}\}\s*$/);return m?m[1]:null;}
  function interp(s,scope){return s.replace(HOLE,function(m,e){var v=get(scope,e);return v==null||v===false?'':String(v);});}
  function build(nodes,scope,out){
    for(var i=0;i<nodes.length;i++){var n=nodes[i];
      if(n.nodeType===3){out.appendChild(document.createTextNode(interp(n.data,scope)));continue;}
      if(n.nodeType!==1)continue;
      if(n.tagName==='TEMPLATE'&&n.hasAttribute('data-sc-if')){if(get(scope,one(n.getAttribute('value'))))build(n.content.childNodes,scope,out);continue;}
